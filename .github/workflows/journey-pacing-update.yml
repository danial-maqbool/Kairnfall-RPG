name: Apply journey and pacing update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/journey-pacing-update.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply progression, gates and guidance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected patch anchor missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          Path('src/Kairnfall.Core/JourneyProgression.cs').write_text(r'''namespace Kairnfall.Core;

public sealed record JourneySuggestion(string ZoneId,string ZoneName,int ThreatLevel,int EntryLevel,bool Locked,int LevelsNeeded);
public sealed record JourneyQuestLead(string QuestId,string QuestName,string GiverId,string GiverName,string ZoneId);

/// <summary>Shared server/client rules for level-gated frontiers and next-step guidance.</summary>
public static class JourneyProgression
{
    public static int ThreatLevel(ZoneDef zone)=>Math.Clamp(zone.Level,1,100);
    public static int EntryRequirement(ZoneDef zone,int authoredRequirement=1)
        =>Math.Clamp(Math.Max(Math.Max(1,authoredRequirement),ThreatLevel(zone)-5),1,Progression.PlayerCap);
    public static int ExitRequirement(Catalog data,ExitDef exit)=>EntryRequirement(data.Zone(exit.Target),exit.Requirement);
    public static bool CanEnter(Character player,ZoneDef zone,int authoredRequirement=1)
        =>Progression.PlayerLevel(player)>=EntryRequirement(zone,authoredRequirement);
    public static string LockMessage(ZoneDef zone,int playerLevel,int requirement)
    {
        int need=Math.Max(0,requirement-playerLevel);
        return need<=0?$"{zone.Name} is open.":$"{zone.Name} opens at character level {requirement}. You are level {playerLevel}; gain {need} more level{(need==1?"":"s")}.";
    }
    public static JourneyQuestLead? LocalQuest(Catalog data,Character player)
    {
        foreach(var quest in data.Quests
            .Where(q=>!player.Quests.ContainsKey(q.Id)&&!player.CompletedQuests.Contains(q.Id)
                &&(q.Prerequisite==""||player.CompletedQuests.Contains(q.Prerequisite)))
            .OrderBy(q=>q.Category=="main"?0:q.Category=="side"?1:2).ThenBy(q=>q.Id,StringComparer.Ordinal))
        {
            var giver=data.Npc(quest.Giver);
            if(giver.Zone==player.Zone)return new(quest.Id,quest.Name,giver.Id,giver.Name,giver.Zone);
        }
        return null;
    }
    public static SkillDef? SuggestedActivity(Catalog data,Character player)
    {
        string[] variety=["mining","woodcutting","fishing","herbalism","cooking","woodworking","smithing","exploration","farming","hunting"];
        return variety.Where(id=>data.Skills.Any(s=>s.Id==id)).Select(data.Skill)
            .OrderBy(s=>Progression.BaseLevel(player,s.Id)).ThenBy(s=>s.Id,StringComparer.Ordinal).FirstOrDefault();
    }
    public static JourneySuggestion? Suggest(Catalog data,Character player)
    {
        var source=data.Zone(player.Zone);int level=Progression.PlayerLevel(player);
        var all=source.Exits.Select(exit=>(Exit:exit,Zone:data.Zone(exit.Target),Gate:ExitRequirement(data,exit)))
            .GroupBy(x=>x.Zone.Id,StringComparer.Ordinal).Select(g=>g.OrderBy(x=>x.Gate).First()).ToArray();
        if(all.Length==0)return null;
        var candidates=all.Where(x=>x.Zone.Kind!="interior").ToArray();
        if(candidates.Length==0)candidates=all;
        var ready=candidates.Where(x=>x.Gate<=level&&x.Zone.Level>=Math.Max(1,source.Level-2))
            .OrderBy(x=>player.Discoveries.Contains(x.Zone.Id)?1:0)
            .ThenBy(x=>Math.Abs(x.Zone.Level-(level+5))).ThenByDescending(x=>x.Zone.Level).FirstOrDefault();
        if(ready.Zone is not null)return new(ready.Zone.Id,ready.Zone.Name,ThreatLevel(ready.Zone),ready.Gate,false,0);
        var locked=candidates.Where(x=>x.Gate>level).OrderBy(x=>x.Gate-level).ThenBy(x=>x.Zone.Level).FirstOrDefault();
        if(locked.Zone is not null)return new(locked.Zone.Id,locked.Zone.Name,ThreatLevel(locked.Zone),locked.Gate,true,locked.Gate-level);
        var fallback=candidates.Where(x=>x.Gate<=level).OrderBy(x=>player.Discoveries.Contains(x.Zone.Id)?1:0)
            .ThenBy(x=>Math.Abs(x.Zone.Level-level)).FirstOrDefault();
        return fallback.Zone is null?null:new(fallback.Zone.Id,fallback.Zone.Name,ThreatLevel(fallback.Zone),fallback.Gate,false,0);
    }
}
''',encoding='utf-8')

          replace('src/Kairnfall.Core/Mechanics.cs',r'''    public static double PlayerLevelValue(Character p)
    {
        // Character XP is simply the sum of awarded skill XP. Skill challenge rules
        // already reduce weak/trivial actions, so do not apply a second hidden filter.
        long total=Total(p);
        double equivalent=BeginnerProgression.OverallEquivalentXp(total);
        double ratio=Math.Clamp(equivalent/(60.0*Threshold(SkillCap)),0,1);
        double trained=1+199*Math.Pow(ratio,0.30);
        // Late mastery still approaches the cap continuously.
        double mastery=Math.Clamp(total/(60.0*Threshold(SkillCap)),0,1);
        double mastered=1+199*Math.Pow(mastery,1.5);
        return Math.Clamp(Math.Max(trained,mastered),1,PlayerCap);
    }
    public static int PlayerLevel(Character p)=>Math.Clamp((int)Math.Floor(PlayerLevelValue(p)),1,PlayerCap);
    public static double PlayerLevelProgress(Character p)
    {
        int level=PlayerLevel(p);
        return level>=PlayerCap?1:Math.Clamp(PlayerLevelValue(p)-level,0,1);
    }
''',r'''    public static long PlayerThreshold(int level)
    {
        int clamped=Math.Clamp(level,1,PlayerCap);
        long maximum=checked(60L*Threshold(SkillCap));
        if(clamped<=1)return 0;
        if(clamped>=PlayerCap)return maximum;
        const long minimumStep=30;
        const double exponent=5.6;
        double t=(clamped-1)/(double)(PlayerCap-1);
        double shaped=(maximum-minimumStep*(PlayerCap-1))*Math.Pow(t,exponent);
        return Math.Clamp(minimumStep*(clamped-1)+(long)Math.Round(shaped,MidpointRounding.AwayFromZero),0,maximum);
    }
    public static long PlayerLevelCost(int level)
    {
        int clamped=Math.Clamp(level,1,PlayerCap);
        return clamped>=PlayerCap?0:Math.Max(1,PlayerThreshold(clamped+1)-PlayerThreshold(clamped));
    }
    public static double PlayerLevelValue(Character p)
    {
        // Character XP remains exactly the sum of awarded skill XP. Only the level
        // thresholds change: the opening levels are short and each later level costs more.
        long total=Total(p);int low=1,high=PlayerCap;
        while(low<high){int mid=(low+high+1)/2;if(PlayerThreshold(mid)<=total)low=mid;else high=mid-1;}
        if(low>=PlayerCap)return PlayerCap;
        long floor=PlayerThreshold(low),ceiling=PlayerThreshold(low+1);
        return low+Math.Clamp((total-floor)/(double)Math.Max(1,ceiling-floor),0,1);
    }
    public static int PlayerLevel(Character p)=>Math.Clamp((int)Math.Floor(PlayerLevelValue(p)),1,PlayerCap);
    public static double PlayerLevelProgress(Character p)
    {
        int level=PlayerLevel(p);
        return level>=PlayerCap?1:Math.Clamp(PlayerLevelValue(p)-level,0,1);
    }
''')

