name: Client performance and motion diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'client/Scripts/ClientPerformanceDiagnostics.cs'
      - 'client/Scripts/GameRoot*.cs'
      - 'client/Scripts/PixelAssets.cs'
      - 'client/Scripts/WorldView*.cs'
      - 'client/Tests/PerformanceMotionDiagnosticsContract.*'
      - 'client/Tests/NativeTestLifetime.cs'
      - 'tools/build_content.py'
      - 'tools/build_game_assets.py'
      - 'tools/complete_skill_icons.py'
      - 'tools/get_godot.py'
      - '.github/workflows/performance-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            godot: linux
          - os: windows-latest
            godot: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      KAIRNFALL_PERF_DIAGNOSTICS: '1'
      KAIRNFALL_PERF_OUTPUT: ${{ github.workspace }}/artifacts/performance-diagnostics/report-${{ matrix.godot }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build deterministic client inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/performance-diagnostics
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install Pillow==12.0.0
          python tools/build_content.py
          python tools/build_game_assets.py
          python tools/complete_skill_icons.py
          dotnet build client/Kairnfall.Client.csproj -c Debug
          python tools/get_godot.py --os '${{ matrix.godot }}'

      - name: Run Linux graphical diagnostic fixture
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path client --import > artifacts/performance-diagnostics/import-linux.log 2>&1
          timeout 240 xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --path client --rendering-method gl_compatibility --audio-driver Dummy res://Tests/PerformanceMotionDiagnosticsContract.tscn > artifacts/performance-diagnostics/native-linux.log 2>&1
          cat artifacts/performance-diagnostics/native-linux.log
          grep -q 'PERFORMANCE_MOTION_DIAGNOSTICS:' artifacts/performance-diagnostics/native-linux.log
          if grep -E '(^|[[:space:]])(ERROR:|SCRIPT ERROR:|Unhandled exception)' artifacts/performance-diagnostics/{import-linux,native-linux}.log; then exit 1; fi

      - name: Run Windows native diagnostic fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/performance-diagnostics | Out-Null
          & $env:GODOT_BIN --headless --editor --path client --import 2>&1 | Tee-Object artifacts/performance-diagnostics/import-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:GODOT_BIN --headless --path client --rendering-method gl_compatibility --audio-driver Dummy res://Tests/PerformanceMotionDiagnosticsContract.tscn 2>&1 | Tee-Object artifacts/performance-diagnostics/native-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String artifacts/performance-diagnostics/native-windows.log -Pattern 'PERFORMANCE_MOTION_DIAGNOSTICS:' -Quiet)) { throw 'Performance diagnostic success marker is missing.' }
          if (Select-String artifacts/performance-diagnostics/*.log -Pattern '(^|\s)(ERROR:|SCRIPT ERROR:|Unhandled exception)' -Quiet) { throw 'Godot error found in performance diagnostics.' }

      - name: Validate bounded report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['KAIRNFALL_PERF_OUTPUT'])
          data=json.loads(path.read_text())
          assert data['schema']==1
          assert len(data['reports'])==11
          assert len(data['syntheticMotion'])==48
          assert len(data['legacySyntheticMotion'])==48
          assert data['windowsGpuPerformanceApproved'] is False
          assert data['sixtyFpsApproved'] is False
          assert all(row['FrameIntervalMs']['Count']>10 for row in data['reports'])
          assert all(row['MaxForwardLeadTiles']<=0.47 for row in data['syntheticMotion'])
          print('PERFORMANCE_REPORT_VALID:', path)
          PY
          git diff --check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-diagnostics-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/performance-diagnostics/
          retention-days: 14
          if-no-files-found: error
