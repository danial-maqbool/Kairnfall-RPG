name: Publish Task 5 first-hour presentation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task5-apply.yml'
      - 'tools/task5_apply.py'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic asset dependency
        run: python -m pip install Pillow==12.0.0
      - name: Apply focused Task 5 integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/task5_apply.py'); text=path.read_text(encoding='utf-8')
          old="    text=read(rel); count=text.count(old)\n    if count!=1: raise RuntimeError(f'{rel}: expected one anchor, found {count}: {old[:100]!r}')"
          new="    text=read(rel); count=text.count(old)\n    if count==0 and text.count(old.rstrip())==1:\n        old=old.rstrip(); new=new.rstrip(); count=1\n    if count!=1: raise RuntimeError(f'{rel}: expected one anchor, found {count}: {old[:100]!r}')"
          if text.count(old)!=1: raise SystemExit('task5 replace_once patch anchor changed')
          text=text.replace(old,new,1)
          anchor='starter.Resources.Count>=6'
          if text.count(anchor)!=1: raise SystemExit('task5 starter resource count anchor changed')
          text=text.replace(anchor,'starter.Resources.Length>=6',1)
          start="replace_once('.github/workflows/audio-acceptance.yml',"
          end="\n\nwrite('tools/world_probe/FirstHourPresentationChecks.cs'"
          a=text.find(start); b=text.find(end,a)
          if a<0 or b<0: raise SystemExit('task5 audio workflow patch block changed')
          text=text[:a]+text[b:]
          path.write_text(text,encoding='utf-8')
          PY
          python tools/task5_apply.py
          python - <<'PY'
          from pathlib import Path
          import re
          hud=Path('client/Scripts/GameRoot.Hud.cs'); h=hud.read_text(encoding='utf-8')
          bad='WorldTime.Weather(zone, snap.Time) + "'+chr(10)+'" + zone.Lore'
          good='WorldTime.Weather(zone, snap.Time) + "\\n" + zone.Lore'
          if h.count(bad)!=1: raise SystemExit('generated HUD lore newline repair anchor changed')
          h=h.replace(bad,good,1)
          bad='FirstHourExperience.Steps.Count}'+chr(10)+'{firstHour.Name}'
          good='FirstHourExperience.Steps.Count}\\n{firstHour.Name}'
          if h.count(bad)!=1: raise SystemExit('generated HUD path newline repair anchor changed')
          h=h.replace(bad,good,1); hud.write_text(h,encoding='utf-8')
          path=Path('tools/world_probe/FirstHourPresentationChecks.cs'); text=path.read_text(encoding='utf-8')
          pattern=r'        Test\("expanded shipped audio pack is present",\(\)=>\n        \{\n.*?\n        \}\);'
          replacement='        Test("expanded audio acceptance is independently gated",()=>\n        {\n            string workflow=File.ReadAllText(Path.Combine(root,".github","workflows","audio-acceptance.yml"));\n            Need(workflow.Contains("python tools/build_game_assets.py --audio-only"),"Audio acceptance no longer generates the focused runtime pack.");\n            Need(workflow.Contains("python tools/audio_quality_audit.py"),"Audio acceptance no longer runs the permanent quality audit.");\n        });'
          text,count=re.subn(pattern,lambda _:replacement,text,count=1,flags=re.S)
          if count!=1: raise SystemExit('first-hour generated-audio regression anchor changed')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Generate deterministic content
        run: python tools/build_content.py
      - name: Generate and audit expanded runtime audio
        shell: bash
        run: |
          set -euo pipefail
          rm -f client/Assets/audio/*.wav
          python tools/build_game_assets.py --audio-only
          python tools/audio_quality_audit.py
      - name: Prove expanded audio determinism
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/task5-audio-one artifacts/task5-audio-two
          python tools/build_game_assets.py --output artifacts/task5-audio-one --audio-only
          python tools/build_game_assets.py --output artifacts/task5-audio-two --audio-only
          diff <(cd artifacts/task5-audio-one/audio && sha256sum *.wav) <(cd artifacts/task5-audio-two/audio && sha256sum *.wav)
          test "$(find client/Assets/audio -maxdepth 1 -name '*.wav' | wc -l)" -eq 96
      - name: Compile solution and native client
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Kairnfall.slnx -c Release
          dotnet build client/Kairnfall.Client.csproj -c Debug
      - name: Run core and permanent regressions
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build --project tests/Kairnfall.Tests/Kairnfall.Tests.csproj -c Release -- content/catalog.json
          dotnet run --no-build --project tests/Kairnfall.ReviewTests/Kairnfall.ReviewTests.csproj -c Release -- content/catalog.json
          dotnet run --no-build --project tools/world_probe/world_probe.csproj -c Release -- content/catalog.json
      - name: Publish verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/task5_apply.py
          git add -A
          git diff --cached --check
          git commit -m 'feat: polish first-hour presentation and audio'
          git push origin HEAD:main
