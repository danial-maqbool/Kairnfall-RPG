name: Verify and apply meaningful regional objectives

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/meaningful-objectives-apply.yml'
      - 'tools/apply_meaningful_objectives_update.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply meaningful-objectives source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_meaningful_objectives_update.py
          python3 tools/build_content.py
      - name: Verify content, server, objectives, and client compile
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Kairnfall.slnx -c Release
          dotnet run --no-build --project tools/world_probe/world_probe.csproj -c Release
          dotnet build client/Kairnfall.Client.csproj -c Debug
          git diff --check
      - name: Publish verified update and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/meaningful-objectives-apply.yml tools/apply_meaningful_objectives_update.py
          git add -A
          git commit -m 'feat: add meaningful regional objectives'
          git pull --rebase origin main
          git push origin HEAD:main
