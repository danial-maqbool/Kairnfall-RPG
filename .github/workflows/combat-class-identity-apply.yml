name: Verify and apply combat class identity
on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_combat_class_identity.py'
      - '.github/workflows/combat-class-identity-apply.yml'
permissions:
  contents: write
concurrency:
  group: combat-class-identity-apply
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install deterministic art dependencies
        run: python3 -m pip install -r tools/requirements-art.txt
      - name: Apply combat feel and class identity candidate
        run: python3 tools/apply_combat_class_identity.py
      - name: Regenerate deterministic content
        run: python3 tools/build_content.py
      - name: Compile complete solution and Godot client
        run: |
          dotnet build Kairnfall.slnx -c Release
          dotnet build client/Kairnfall.Client.csproj -c Release
      - name: Run core and malformed-input regressions
        run: |
          dotnet run --no-build --project tests/Kairnfall.Tests/Kairnfall.Tests.csproj -c Release -- content/catalog.json
          dotnet run --no-build --project tests/Kairnfall.ReviewTests/Kairnfall.ReviewTests.csproj -c Release
      - name: Run world progression combat and class-identity acceptance
        run: dotnet run --no-build --project tools/world_probe/world_probe.csproj -c Release | tee combat-class-world.log
      - name: Require class identity acceptance groups
        run: |
          grep -F 'CLASS COMBAT IDENTITY: 7 groups passed' combat-class-world.log
      - name: Rebuild and structurally validate deterministic game assets
        run: |
          python3 tools/build_game_assets.py
          python3 tools/complete_skill_icons.py
          python3 tools/validate_game_assets.py
      - name: Verify clean patch formatting
        run: git diff --check
      - name: Publish verified feature and remove temporary tooling
        run: |
          rm tools/apply_combat_class_identity.py .github/workflows/combat-class-identity-apply.yml
          git add -A
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: deepen combat feel and class identity'
          git push origin HEAD:main
