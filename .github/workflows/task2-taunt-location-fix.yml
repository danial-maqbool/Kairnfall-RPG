name: Apply Task 2 taunt-location correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/task2-taunt-location-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep self-centered taunt aim at the caster and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tools/world_probe/RealActivityProgressionChecks.cs')
          text=path.read_text()
          old='else if (target is not null) aim = target.Position;'
          new='else if (ability.Kind != "taunt" && target is not null) aim = target.Position;'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one target-position aim expression to patch.')
          path.write_text(text.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/world_probe/RealActivityProgressionChecks.cs
          git rm .github/workflows/task2-taunt-location-fix.yml
          git commit -m 'test(progression): keep taunt aim on the caster'
          git push origin HEAD:main
