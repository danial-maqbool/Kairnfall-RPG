name: Diagnose rarity patch guard
on:
  push:
    branches: ['team/rarity-elements-boss-uniques']
jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: team/rarity-elements-boss-uniques
      - name: Run patch with replacement diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/phase_rarity_elements_patch.py')
          text=path.read_text(encoding='utf-8')
          old="raise SystemExit(f'{path}: expected one replacement, found {count}')"
          new="raise SystemExit(f'{path}: expected one replacement, found {count}; needle={old[:160]!r}')"
          if text.count(old)!=1: raise SystemExit('diagnostic hook mismatch')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          python tools/phase_rarity_elements_patch.py
