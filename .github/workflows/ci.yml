name: Build and verify
on:
  push:
    branches: [main, 'team/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile authoritative simulation
        run: dotnet build src/Kairnfall.Core/Kairnfall.Core.csproj -c Release
      - name: Build content when present
        if: hashFiles('tools/build_content.py') != ''
        run: python3 tools/build_content.py
      - name: Run implemented regression suite
        if: hashFiles('tests/Kairnfall.Tests/Kairnfall.Tests.csproj') != ''
        run: dotnet run --project tests/Kairnfall.Tests/Kairnfall.Tests.csproj -c Release -- content/catalog.json
      - name: Preserve source for reproducibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-source-${{ github.sha }}
          path: |
            src/
            tests/
            tools/
            content/
            client/
            docs/
            *.props
            *.json
            *.slnx
            *.ps1
            LICENSE
            README.md
          retention-days: 7
