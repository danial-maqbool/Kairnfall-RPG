name: Build and verify
on:
  push:
    branches: [main, 'team/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile authoritative simulation
        run: dotnet build src/Kairnfall.Core/Kairnfall.Core.csproj -c Release
      - name: Compile dedicated server
        if: hashFiles('src/Kairnfall.Server/Program.cs') != ''
        run: dotnet build src/Kairnfall.Server/Kairnfall.Server.csproj -c Release
      - name: Compile and validate content
        run: python3 tools/build_content.py
      - name: Run regression tests
        run: dotnet run --project tests/Kairnfall.Tests/Kairnfall.Tests.csproj -c Release -- content/catalog.json
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            test-results/
            content/coverage.json
          retention-days: 14
      - name: Preserve source for reproducibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-source-${{ github.sha }}
          path: |
            src/
            tests/
            tools/
            content/
            client/
            docs/
            *.props
            *.json
            *.slnx
            *.ps1
            LICENSE
            README.md
            AGENTS.md
            !**/bin/**
            !**/obj/**
            !**/__pycache__/**
            !**/.godot/**
          retention-days: 7
