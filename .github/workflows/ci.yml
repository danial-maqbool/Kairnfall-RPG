name: Build and verify
on:
  push:
    branches: [main, 'team/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kairnfall_test
          POSTGRES_PASSWORD: disposable-ci-database-only
          POSTGRES_DB: kairnfall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairnfall_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KAIRNFALL_TEST_DB: Host=127.0.0.1;Port=5432;Database=kairnfall_test;Username=kairnfall_test;Password=disposable-ci-database-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate and validate deterministic content
        run: python3 tools/build_content.py
      - name: Compile authoritative simulation and network transport
        run: dotnet build src/Kairnfall.Core/Kairnfall.Core.csproj -c Release
      - name: Run core regression suite
        run: dotnet run --project tests/Kairnfall.Tests/Kairnfall.Tests.csproj -c Release -- content/catalog.json
      - name: Compile persistent server
        run: dotnet build src/Kairnfall.Server/Kairnfall.Server.csproj -c Release
      - name: Run PostgreSQL and network integration suite
        if: hashFiles('tests/Kairnfall.Integration/Kairnfall.Integration.csproj') != ''
        run: dotnet run --project tests/Kairnfall.Integration/Kairnfall.Integration.csproj -c Release
      - name: Preserve exact source and test evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.')
          folders=['src','tests','tools','content_src','content','client','docs','.github']
          with zipfile.ZipFile('kairnfall-source.zip','w',zipfile.ZIP_DEFLATED) as out:
              for folder in folders:
                  for path in (root/folder).rglob('*'):
                      if path.is_file() and not any(p in {'bin','obj','.godot','__pycache__'} for p in path.parts): out.write(path,path.as_posix())
              for pattern in ['*.props','*.json','*.slnx','*.ps1','*.yml','LICENSE','README.md','AGENTS.md','.gitignore','.env.example']:
                  for path in root.glob(pattern):
                      if path.is_file(): out.write(path,path.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-source-${{ github.sha }}
          path: |
            kairnfall-source.zip
            artifacts/test-results/
            artifacts/logs/
          retention-days: 3
