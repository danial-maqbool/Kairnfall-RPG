name: Temporary Task 7 test fixture patch
on:
  push:
    paths:
      - '.github/workflows/task7-test-fixture-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Correct persistence test fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tools/world_probe/PersistenceReliabilityChecks.cs')
          text=path.read_text()
          text=text.replace('realm.CreateCharacter("persist-account"+suffix,"Persist Hero"+suffix,"vanguard",new())','realm.CreateCharacter("persist-account"+suffix,"P"+suffix,"vanguard",new())')
          old='var sale=Items.Create(data,"healing_potion",1); Items.Add(seller.Inventory,sale,data); string itemId=sale.Id;'
          new='var unique=data.Items.First(i=>i.StackMax==1&&i.Type!="quest"&&i.Value>0); var sale=Items.Create(data,unique.Id,1); seller.Inventory.Add(sale); string itemId=sale.Id;'
          if old not in text:
              raise SystemExit('Expected auction fixture not found')
          text=text.replace(old,new,1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/world_probe/PersistenceReliabilityChecks.cs
          git commit -m "test: correct persistence reliability fixtures"
          git push origin HEAD:main
