name: Publish rarity elements and boss uniques
on:
  push:
    branches: ['team/rarity-elements-boss-uniques']
permissions:
  contents: write
jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: team/rarity-elements-boss-uniques
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed gameplay content and UI patches
        run: |
          python tools/phase_rarity_elements_patch.py
          python tools/phase_rarity_elements_patch_followup.py
      - name: Prepare deterministic content and art tooling
        run: |
          python -m pip install Pillow==12.0.0
          python tools/build_content.py
      - name: Run focused rarity element and unique tests
        run: |
          python -m unittest tests.handoff.test_rarity_elements_uniques -v
          python -m unittest atelier.tests.test_sprite_refinement -v
      - name: Compile and run core gameplay regressions
        run: |
          dotnet build Kairnfall.slnx -c Release
          dotnet build client/Kairnfall.Client.csproj -c Debug
          dotnet run --no-build --project tests/Kairnfall.Tests/Kairnfall.Tests.csproj -c Release -- content/catalog.json
          dotnet run --no-build --project tools/world_probe/world_probe.csproj -c Release
      - name: Snapshot existing source-controlled generated paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          roots=[Path('atelier/Assets'),Path('foundry/Assets/atlas_atelier')]
          paths=sorted(p.as_posix() for root in roots for p in root.rglob('*') if p.is_file())
          Path('/tmp/before-paths.json').write_text(json.dumps(paths),encoding='utf-8')
          print('PATH SNAPSHOT',len(paths))
          PY
      - name: Rebuild item and equipment art with boss relics
        run: |
          mkdir -p artifacts
          python atelier/build.py --only items equipment gear gear_worn --jobs 8
          python atelier/build.py --manifest
          python foundry/build.py --pack-atelier --atlas
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from tools import build_content
          data=build_content.build()
          uniques=[item for item in data['items'] if 'boss_unique' in item.get('tags',())]
          paths=[Path('atelier/Assets/equipment')/(item['id']+'.png') for item in uniques]
          missing=[str(path) for path in paths if not path.exists()]
          if missing: raise SystemExit('Missing unique sprites: '+', '.join(missing[:5]))
          sheet=Image.new('RGBA',(8*32,5*32),(0,0,0,0))
          for index,path in enumerate(paths): sheet.alpha_composite(Image.open(path).convert('RGBA'),((index%8)*32,(index//8)*32))
          sheet.save('artifacts/boss-unique-items.png')
          print('UNIQUE PREVIEW',len(paths),'icons')
          PY
      - name: Verify additions are only expected unique assets and snapshot repeat bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          before=set(json.loads(Path('/tmp/before-paths.json').read_text(encoding='utf-8')))
          roots=[Path('atelier/Assets'),Path('foundry/Assets/atlas_atelier')]
          after=set(p.as_posix() for root in roots for p in root.rglob('*') if p.is_file())
          removed=sorted(before-after)
          if removed: raise SystemExit('Generated art paths were removed: '+str(removed[:10]))
          added=sorted(after-before)
          unexpected=[p for p in added if p.startswith('atelier/Assets/') and 'boss_' not in p]
          if unexpected: raise SystemExit('Unexpected new Atelier asset paths: '+str(unexpected[:10]))
          files=sorted([p for root in roots for p in root.rglob('*') if p.is_file()]+[Path('atelier/gear.json'),Path('atelier/coverage.json'),Path('foundry/coverage.json')])
          hashes={p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in files if p.exists()}
          Path('/tmp/first-hashes.json').write_text(json.dumps(hashes,sort_keys=True),encoding='utf-8')
          print('PATH SAFETY PASS',len(after),'files;',len(added),'new expected paths')
          PY
      - name: Rebuild art a second time and require byte-identical output
        run: |
          python atelier/build.py --only items equipment gear gear_worn --jobs 8
          python atelier/build.py --manifest
          python foundry/build.py --pack-atelier --atlas
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          expected=json.loads(Path('/tmp/first-hashes.json').read_text(encoding='utf-8'))
          actual={path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in expected}
          changed=[path for path in expected if actual[path]!=expected[path]]
          if changed: raise SystemExit('Non-deterministic generated output: '+str(changed[:10]))
          print('DETERMINISM PASS',len(expected),'files')
          PY
      - name: Re-run content unique tests against regenerated art
        run: |
          python -m unittest tests.handoff.test_rarity_elements_uniques -v
      - name: Build and validate final game asset pack
        run: |
          python tools/build_game_assets.py
          python tools/complete_skill_icons.py
          python tools/validate_game_assets.py
      - name: Run verified native Godot import and item card contract
        run: |
          python tools/get_godot.py --os linux
          GODOT_BIN=$(python -c "import json; print(json.load(open('.tools/godot.json'))['binary'])")
          timeout 180 "$GODOT_BIN" --headless --editor --path client --import
          timeout 180 "$GODOT_BIN" --headless --path client res://Tests/CompactItemCardContract.tscn
      - uses: actions/upload-artifact@v4
        with:
          name: rarity-elements-boss-uniques-${{ github.sha }}
          path: |
            artifacts/boss-unique-items.png
            artifacts/test-results
          retention-days: 14
      - name: Commit and push verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Kairnfall.Core/Models.cs src/Kairnfall.Core/Mechanics.cs src/Kairnfall.Core/EquipmentComparison.cs src/Kairnfall.Core/RealmEconomy.cs src/Kairnfall.Core/RealmCombat.cs content_src/boss_uniques.py tools/build_content.py tests/Kairnfall.Tests/Program.cs tests/handoff/test_rarity_elements_uniques.py client/Scripts/Ui.cs client/Scripts/GameRoot.Inventory.cs client/Scripts/CompactItemCard.cs client/Scripts/HudWidgets.cs client/Scripts/GameRoot.Hud.cs atelier/forge/smith.py client/Data/catalog.json atelier/Assets atelier/gear.json atelier/coverage.json foundry/Assets/atlas_atelier foundry/coverage.json
          git diff --cached --quiet && { echo 'No implementation changes staged'; exit 1; }
          git commit -m 'feat(items): add rarity skill affixes elements and boss relics' -m 'Give equipment rarity-scaled temporary skill levels, higher crafting gates for rare quality, balanced elemental strengths and weaknesses with attunement scaling, native element badges, and forty boss-only signature relics across all eight classes and five progression milestones.'
          git push origin HEAD:team/rarity-elements-boss-uniques
