name: Validation toolchain
on:
  push:
    paths: ['.github/workflows/toolchain.yml']
    branches: ['team/**']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_INSTALL_DIR: /home/runner/kairnfall-dotnet
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Package isolated SDK
        run: |
          dotnet --info
          tar -czf "$RUNNER_TEMP/dotnet-tools.tar.gz" -C "$DOTNET_INSTALL_DIR" .
      - name: Get pinned Godot editor
        run: |
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip' -o "$RUNNER_TEMP/godot-tools.zip"
          unzip -t "$RUNNER_TEMP/godot-tools.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-toolchain
          path: |
            ${{ runner.temp }}/dotnet-tools.tar.gz
            ${{ runner.temp }}/godot-tools.zip
          retention-days: 1
          compression-level: 0
