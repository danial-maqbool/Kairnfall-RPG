name: Character commit diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/character-commit-diagnostic.yml']
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Read the exact failed publication step
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/commit-diagnostic
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/35274882082/logs > artifacts/commit-diagnostic/logs.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile
          lines=['Candidate run: 35274882082; parent d24d23f2db65f210946dc88a531e6665ab29c45c','']
          with zipfile.ZipFile('artifacts/commit-diagnostic/logs.zip') as archive:
              for name in archive.namelist():
                  if 'Commit only the tested' not in name:continue
                  lines.extend(['FILE: '+name,archive.read(name).decode('utf-8',errors='replace')[-24000:]])
          if len(lines)==2:raise SystemExit('The failed commit step was not present in the Actions log archive.')
          path=Path('docs/art/character-rebuild/commit-failure.txt')
          path.write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/art/character-rebuild/commit-failure.txt
          git commit -m 'test(characters): retain final publication failure diagnostics'
          gh auth setup-git
          git push origin HEAD:main
