name: Verify and publish compact tooltip and sprite refinement v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sprite-quality-update-v2.yml']
permissions:
  contents: write
concurrency:
  group: sprite-quality-update-v2
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Pinned prerequisites and exact before review
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow==12.0.0
          python tools/build_content.py > /tmp/content.log
          mkdir -p artifacts/sprite-quality/{before,after,engine,logs}
          git rev-parse HEAD > artifacts/sprite-quality/base-revision.txt
          python --version | tee artifacts/sprite-quality/logs/python.log
          python - <<'PY' | tee artifacts/sprite-quality/logs/pillow.log
          import PIL
          print('Pillow',PIL.__version__)
          PY
          for sheet in body beasts items gear scene; do python atelier/preview.py "$sheet" --out "artifacts/sprite-quality/before/$sheet.png"; done
      - name: Apply reviewed source patch
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          base='c3003a477a25c50d646299c2fcd59fce704cb136'
          blob='31f8633654bd3e76d5c5997475526b4b1384d100'
          digest='70a8155055f29cf0d0e530885091d38db776cacad8c45039805dab9f81662866'
          allowed={'client/Scripts/CompactItemCard.cs','client/Tests/ItemCommerceUiChecks.cs','atelier/forge/brush.py','atelier/forge/folk.py','atelier/forge/beasts.py','atelier/forge/smith.py','atelier/tests/test_sprite_refinement.py'}
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{blob}"
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=45) as response: record=json.load(response)
          packed=base64.b64decode(record['content'])
          if hashlib.sha1(b'blob '+str(len(packed)).encode()+b'\0'+packed).hexdigest()!=blob: raise SystemExit('Git object integrity failed')
          patch=gzip.decompress(packed)
          if hashlib.sha256(patch).hexdigest()!=digest: raise SystemExit('Reviewed patch SHA-256 failed')
          target=Path('artifacts/sprite-quality/refinement.patch');target.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          if changed!=allowed: raise SystemExit('Unexpected patch paths: '+repr(sorted(changed)))
          # Pillow-compatible equivalent of the two local review assertions: avoid deprecated iteration helpers.
          test=Path('atelier/tests/test_sprite_refinement.py')
          text=test.read_text()
          text=text.replace("opaque = [pixel[:3] for pixel in first.get_flattened_data() if pixel[3] >= 220]","pixels = first.load()\n        opaque = [pixels[x, y][:3] for y in range(first.height) for x in range(first.width) if pixels[x, y][3] >= 220]")
          text=text.replace("self.assertGreater(len(set(pixel[:3] for pixel in first.get_flattened_data() if pixel[3] >= 220)), 8)","pixels = first.load()\n        self.assertGreater(len(set(pixels[x, y][:3] for y in range(first.height) for x in range(first.width) if pixels[x, y][3] >= 220)), 8)")
          test.write_text(text)
          subprocess.run(['git','add',str(test)],check=True)
          print('Applied exact reviewed implementation paths:',len(changed))
      - name: Focused tests and after review sheets
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest atelier.tests.test_sprite_refinement -v 2>&1 | tee artifacts/sprite-quality/logs/refinement-tests.log
          for sheet in body beasts items gear scene; do python atelier/preview.py "$sheet" --out "artifacts/sprite-quality/after/$sheet.png"; done
      - name: Rebuild committed art twice and require byte stability
        shell: bash
        run: |
          set -euo pipefail
          rebuild(){ python atelier/build.py --only items people equipment npcs mobs gear gear_worn --jobs 8; python atelier/build.py --manifest; python foundry/build.py --pack-atelier --atlas; }
          rebuild 2>&1 | tee artifacts/sprite-quality/logs/art-first.log
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def snap():
            out={}
            for root in (Path('atelier/Assets'),Path('foundry/Assets/atlas_atelier')):
              for p in sorted(x for x in root.rglob('*') if x.is_file()): out[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
            p=Path('atelier/gear.json');out[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
            c=json.loads(Path('atelier/coverage.json').read_text());c.pop('built_seconds',None);out['atelier/coverage.json#normalized']=hashlib.sha256(json.dumps(c,sort_keys=True).encode()).hexdigest()
            return out
          Path('artifacts/sprite-quality/first-hashes.json').write_text(json.dumps(snap(),sort_keys=True,indent=2)+'\n')
          PY
          rebuild 2>&1 | tee artifacts/sprite-quality/logs/art-second.log
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected=json.loads(Path('artifacts/sprite-quality/first-hashes.json').read_text());actual={}
          for root in (Path('atelier/Assets'),Path('foundry/Assets/atlas_atelier')):
            for p in sorted(x for x in root.rglob('*') if x.is_file()): actual[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          p=Path('atelier/gear.json');actual[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          c=json.loads(Path('atelier/coverage.json').read_text());c.pop('built_seconds',None);actual['atelier/coverage.json#normalized']=hashlib.sha256(json.dumps(c,sort_keys=True).encode()).hexdigest()
          if expected!=actual:
            bad=sorted(k for k in set(expected)|set(actual) if expected.get(k)!=actual.get(k));raise SystemExit('Non-deterministic output: '+', '.join(bad[:30]))
          print('DETERMINISM PASS:',len(actual),'records; only coverage built_seconds excluded')
          PY
      - name: Compile, integrate art, and validate game assets
        shell: bash
        run: |
          set -euo pipefail
          dotnet build client/Kairnfall.Client.csproj -c Debug 2>&1 | tee artifacts/sprite-quality/logs/client-build.log
          python tools/build_game_assets.py 2>&1 | tee artifacts/sprite-quality/logs/game-assets.log
          python tools/complete_skill_icons.py 2>&1 | tee artifacts/sprite-quality/logs/skill-icons.log
          python tools/validate_game_assets.py 2>&1 | tee artifacts/sprite-quality/logs/asset-validation.log
          python tools/get_godot.py --os linux 2>&1 | tee artifacts/sprite-quality/logs/godot.log
      - name: Native compact-tooltip and graphical regression
        env: {KAIRNFALL_SCREENSHOTS: '${{ github.workspace }}/artifacts/sprite-quality/engine'}
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 "$GODOT_BIN" --headless --editor --path client --import 2>&1 | tee artifacts/sprite-quality/logs/import.log
          timeout 180 "$GODOT_BIN" --verbose --headless --path client res://Tests/ControlRulesContract.tscn 2>&1 | tee artifacts/sprite-quality/logs/control-rules.log
          timeout 240 xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_BIN" --path client --rendering-method gl_compatibility --audio-driver Dummy res://Tests/VisualPresentationContract.tscn 2>&1 | tee artifacts/sprite-quality/logs/native-visual.log
          for log in import control-rules native-visual; do if grep -E '(^|[[:space:]])(ERROR:|SCRIPT ERROR:|Unhandled exception)' "artifacts/sprite-quality/logs/$log.log"; then exit 1; fi; done
          test -s artifacts/sprite-quality/engine/item-compare-1280.png
          test -s artifacts/sprite-quality/engine/ui-inventory-1280.png
          test -s artifacts/sprite-quality/engine/01-village-1280.png
      - name: Stage only requested source and regenerated libraries
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet HEAD -- client/Assets tools/art content_src content
          git add -- client/Scripts/CompactItemCard.cs client/Tests/ItemCommerceUiChecks.cs atelier/forge/brush.py atelier/forge/folk.py atelier/forge/beasts.py atelier/forge/smith.py atelier/tests/test_sprite_refinement.py atelier/Assets atelier/coverage.json atelier/gear.json foundry/Assets/atlas_atelier
          git diff --cached --check
          git diff --cached --name-only | tee artifacts/sprite-quality/published-files.txt
          python - <<'PY'
          from pathlib import Path
          paths=Path('artifacts/sprite-quality/published-files.txt').read_text().splitlines()
          allowed=('client/Scripts/CompactItemCard.cs','client/Tests/ItemCommerceUiChecks.cs','atelier/','foundry/Assets/atlas_atelier/')
          bad=[p for p in paths if not p.startswith(allowed)]
          if not paths or bad: raise SystemExit('Unexpected publish scope: '+repr(bad))
          print('Publish scope:',len(paths),'files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sprite-quality-review-${{ github.sha }}
          path: artifacts/sprite-quality/
          if-no-files-found: error
          retention-days: 14
      - name: Push only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Danial Maqbool'
          git config user.email 'danial.maqbool48@gmail.com'
          git commit -m 'refactor(art): compact item hover cards and refine sprite pixel detail' -m 'Keep the 64px actor, 128px boss and 32px icon contracts while adding a second modelling pass, garment construction detail, species surface cues and material micro-detail. Rebuild and commit Atelier outputs and the packed Foundry atlas after deterministic and native Godot review.' -m 'Co-Authored-By: GPT 6 Pro <noreply@openai.com>'
          git push origin HEAD:main
