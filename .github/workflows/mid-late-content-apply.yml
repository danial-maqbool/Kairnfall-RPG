name: Verify and apply mid late game content

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mid-late-content-apply.yml'
      - 'tools/apply_mid_late_game_update.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply mid and late game content update
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_mid_late_game_update.py
          python3 tools/build_content.py
          git diff --check
      - name: Verify content contracts and complete server/client build
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Kairnfall.slnx -c Release
          dotnet run --no-build --project tools/world_probe/world_probe.csproj -c Release
          dotnet build client/Kairnfall.Client.csproj -c Debug
      - name: Validate retained deterministic game assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_game_assets.py
      - name: Publish verified Area 7 update and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mid-late-content-apply.yml tools/apply_mid_late_game_update.py
          git add -A
          git commit -m 'feat: deepen mid and late game expedition content'
          git pull --rebase origin main
          git push origin HEAD:main
