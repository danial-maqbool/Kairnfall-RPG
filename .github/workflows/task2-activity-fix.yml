name: Apply Task 2 activity audit correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/task2-activity-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct self-centered taunt fixture and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tools/world_probe/RealActivityProgressionChecks.cs')
          text=path.read_text()
          old='var result = Act(realm, p, "cast", target: ability.Kind == "dash" ? "" : target?.Id ?? "", item: ability.Id, x: aim.X, y: aim.Y);'
          new='var result = Act(realm, p, "cast", target: ability.Kind is "dash" or "taunt" ? "" : target?.Id ?? "", item: ability.Id, x: aim.X, y: aim.Y);'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one taunt/dash cast expression to patch.')
          path.write_text(text.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/world_probe/RealActivityProgressionChecks.cs
          git rm .github/workflows/task2-activity-fix.yml
          git commit -m 'test(progression): cast taunts as self-centered effects'
          git push origin HEAD:main
