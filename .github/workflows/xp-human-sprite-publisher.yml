name: Publish XP and humanoid refinement
on:
  push:
    branches: ['team/xp-human-sprites']
permissions:
  contents: write
jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: team/xp-human-sprites
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed source patch
        run: python tools/phase_xp_humanoid_patch.py
      - name: Prepare deterministic content and art tooling
        run: |
          python -m pip install Pillow==12.0.0
          python tools/build_content.py
      - name: Run focused progression and sprite tests
        run: |
          python -m unittest atelier.tests.test_sprite_refinement -v
          dotnet build Kairnfall.slnx -c Release
          dotnet run --no-build --project tests/Kairnfall.Tests/Kairnfall.Tests.csproj -c Release -- content/catalog.json
          dotnet run --no-build --project tools/world_probe/world_probe.csproj -c Release
      - name: Snapshot source-controlled generated paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          roots=[Path('atelier/Assets'),Path('foundry/Assets/atlas_atelier')]
          paths=sorted(p.as_posix() for root in roots for p in root.rglob('*') if p.is_file())
          Path('/tmp/before-paths.json').write_text(json.dumps(paths),encoding='utf-8')
          print('PATH SNAPSHOT',len(paths))
          PY
      - name: Rebuild humanoids and equipment overlays
        run: |
          mkdir -p artifacts
          python atelier/build.py --only people equipment npcs gear_worn --jobs 8
          python atelier/build.py --manifest
          python foundry/build.py --pack-atelier --atlas
          python atelier/preview.py body --out artifacts/humanoid-body.png
          python atelier/preview.py gear --out artifacts/humanoid-gear.png
      - name: Verify stable paths and exact repeat determinism
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          roots=[Path('atelier/Assets'),Path('foundry/Assets/atlas_atelier')]
          paths=sorted(p.as_posix() for root in roots for p in root.rglob('*') if p.is_file())
          before=json.loads(Path('/tmp/before-paths.json').read_text(encoding='utf-8'))
          if paths!=before: raise SystemExit('Generated asset path set changed')
          tracked=[Path(p) for p in paths]+[Path('atelier/gear.json'),Path('atelier/coverage.json'),Path('foundry/coverage.json')]
          hashes={p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in tracked}
          Path('/tmp/first-hashes.json').write_text(json.dumps(hashes,sort_keys=True),encoding='utf-8')
          print('FIRST HASH SNAPSHOT',len(hashes))
          PY
          python atelier/build.py --only people equipment npcs gear_worn --jobs 8
          python atelier/build.py --manifest
          python foundry/build.py --pack-atelier --atlas
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          first=json.loads(Path('/tmp/first-hashes.json').read_text(encoding='utf-8'))
          changed=[p for p,h in first.items() if hashlib.sha256(Path(p).read_bytes()).hexdigest()!=h]
          if changed: raise SystemExit('Non-deterministic files: '+', '.join(changed[:20]))
          print('DETERMINISM PASS',len(first),'files')
          PY
      - name: Build and validate final game asset pack
        run: |
          python tools/build_game_assets.py
          python tools/complete_skill_icons.py
          python tools/validate_game_assets.py
          dotnet build client/Kairnfall.Client.csproj -c Debug
      - name: Run verified native Godot import and contract
        run: |
          python tools/get_godot.py --os linux
          GODOT_BIN=$(python -c "import json; print(json.load(open('.tools/godot.json'))['binary'])")
          timeout 180 "$GODOT_BIN" --headless --editor --path client --import
          timeout 180 "$GODOT_BIN" --headless --path client res://Tests/CompactItemCardContract.tscn
      - uses: actions/upload-artifact@v4
        with:
          name: xp-humanoid-refinement-${{ github.sha }}
          path: |
            artifacts/humanoid-body.png
            artifacts/humanoid-gear.png
            docs/handoff/XP_HUMANOID_REFINEMENT_2026-09-10.md
          retention-days: 14
      - name: Commit and push verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Kairnfall.Core/Mechanics.cs src/Kairnfall.Core/Models.cs tests/Kairnfall.Tests/Program.cs client/Scripts/GameRoot.Experience.cs client/Scripts/GameRoot.Hud.cs atelier/forge/rig.py atelier/forge/folk.py atelier/tests/test_sprite_refinement.py docs/handoff/XP_HUMANOID_REFINEMENT_2026-09-10.md atelier/Assets atelier/gear.json atelier/coverage.json foundry/Assets/atlas_atelier foundry/coverage.json
          git diff --cached --quiet && { echo 'No implementation changes staged'; exit 1; }
          git commit -m 'fix(progression): restore XP gains and refine humanoids' -m 'Keep successful trivial practice at a bounded fractional floor, expose overall and transient skill XP bars, and refine the shared humanoid/equipment rig without changing sprite anchors or stable asset paths.'
          git push origin HEAD:team/xp-human-sprites
