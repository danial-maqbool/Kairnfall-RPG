          import hashlib,json
          roots=[Path('atelier/Assets'),Path('foundry/Assets/atlas_atelier')]
          paths=sorted(str(p).replace('\\','/') for root in roots for p in root.rglob('*') if p.is_file())
          before=json.loads(Path('/tmp/before-paths.json').read_text())
          if paths!=before:
              raise SystemExit('Generated humanoid rebuild changed stable asset paths')
          tracked=[Path(p) for p in paths]+[Path('atelier/gear.json'),Path('atelier/coverage.json')]
          hashes={str(p).replace('\\','/'):hashlib.sha256(p.read_bytes()).hexdigest() for p in tracked}
          Path('/tmp/first-hashes.json').write_text(json.dumps(hashes,sort_keys=True))
          PY
          python atelier/build.py --only people equipment npcs gear_worn --jobs 8
          python atelier/build.py --manifest
          python foundry/build.py --pack-atelier --atlas
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          first=json.loads(Path('/tmp/first-hashes.json').read_text())
          second={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in first}
          changed=[p for p in first if first[p]!=second[p]]
          if changed: raise SystemExit('Non-deterministic generated files: '+', '.join(changed[:20]))
          print('DETERMINISM PASS:',len(first),'files')
          PY
      - name: Build and validate final game asset pack
        run: |
          python tools/build_game_assets.py
          python tools/complete_skill_icons.py
          python tools/validate_game_assets.py
          dotnet build client/Kairnfall.Client.csproj -c Debug
      - name: Run verified native Godot import and contract
        shell: bash
        run: |
          python tools/get_godot.py --os linux
          GODOT_BIN=$(python - <<'PY'
          import json
          print(json.load(open('.tools/godot.json'))['binary'])
          PY
          )
          timeout 180 "$GODOT_BIN" --headless --editor --path client --import
          timeout 180 "$GODOT_BIN" --headless --path client res://Tests/CompactItemCardContract.tscn
      - name: Assert intended HUD and generated scopes
        shell: bash
        run: |
          grep -q 'CharacterExperienceBar' client/Scripts/GameRoot.Experience.cs
          grep -q 'SkillExperienceBar_' client/Scripts/GameRoot.Experience.cs
          grep -q 'now+2.6' client/Scripts/GameRoot.Experience.cs
          git diff --quiet HEAD -- client/Assets content || true
          test ! -e client/Assets/.git
      - uses: actions/upload-artifact@v4
        with:
          name: xp-humanoid-refinement-${{ github.sha }}
          path: |
            artifacts/humanoid-body.png
            artifacts/humanoid-gear.png
            docs/handoff/XP_HUMANOID_REFINEMENT_2026-09-10.md
          retention-days: 14
      - name: Commit and push verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Kairnfall.Core/Mechanics.cs src/Kairnfall.Core/Models.cs tests/Kairnfall.Tests/Program.cs client/Scripts/GameRoot.Experience.cs client/Scripts/GameRoot.Hud.cs atelier/forge/rig.py atelier/forge/folk.py atelier/tests/test_sprite_refinement.py docs/handoff/XP_HUMANOID_REFINEMENT_2026-09-10.md atelier/Assets atelier/manifest.json atelier/gear.json atelier/coverage.json foundry/Assets/atlas_atelier foundry/manifest.json
          git diff --cached --quiet && { echo 'No implementation changes staged'; exit 1; }
          git commit -m 'fix(progression): restore XP gains and refine humanoids' -m 'Keep trivial successful practice at a bounded fractional floor, expose overall and transient skill progress bars, and refine the shared humanoid/equipment rig without changing sprite anchors or asset paths.'
          git push origin HEAD:team/xp-human-sprites
