name: Integrate verified visual source on main
on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-visual.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: integrate-visual-main
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CANDIDATE: efca073b1b4a6f24e15d7a2bde5621cb0be18a76
      TEST_REQUEST: cb1bf09341662e2f6f400bbcff141069ee76b4c8
      SOURCE_BASE: dcc84f50fe2c5f1dcff616df97c9e1ac7112c2c4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify exact passing test requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          root = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def get(path):
              request = urllib.request.Request(root + path, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: return json.load(response)
          revision=os.environ['TEST_REQUEST']; candidate=os.environ['CANDIDATE']
          value=get('/contents/.ci/experience-candidate.json?ref='+revision)
          recorded=json.loads(base64.b64decode(value['content']))
          if recorded['sha'] != candidate or recorded['mode'] != 'repair': raise SystemExit('Test request does not identify this candidate')
          runs=get('/actions/runs?head_sha='+revision+'&per_page=100')['workflow_runs']
          for path in ('.github/workflows/experience-candidate.yml','.github/workflows/visual-review.yml'):
              matches=[run for run in runs if run['path']==path]
              if not matches: raise SystemExit('Required workflow is missing: '+path)
              run=max(matches,key=lambda value:value['id'])
              print(path,run['id'],run['status'],run['conclusion'])
              if run['status'] != 'completed' or run['conclusion'] != 'success': raise SystemExit('Required workflow has not passed')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Merge exact source into main and prove source equivalence
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          git fetch origin "$CANDIDATE"
          git merge-base --is-ancestor "$SOURCE_BASE" "$CANDIDATE"
          python3 - <<'PY'
          import os,subprocess
          changes=subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_BASE'],'HEAD'],text=True).splitlines()
          if any(not path.startswith(('.ci/','.github/')) for path in changes):
              raise SystemExit('Main source changed after baseline. Refuse an unreviewed integration.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff "$CANDIDATE" -m 'feat(visual): integrate tested humanoid equipment and creature presentation repairs'
          git diff --exit-code "$CANDIDATE" -- client src content_src tests tools docs README.md AGENTS.md
          python -m pip install Pillow==12.0.0
          python tools/build_content.py
          dotnet build Kairnfall.slnx -c Release
          dotnet build client/Kairnfall.Client.csproj -c Debug
          dotnet run --no-build --project tests/Kairnfall.Tests/Kairnfall.Tests.csproj -c Release -- content/catalog.json
          dotnet run --no-build --project tests/Kairnfall.ReviewTests/Kairnfall.ReviewTests.csproj -c Release
          dotnet run --no-build --project tests/Kairnfall.SecurityTests/Kairnfall.SecurityTests.csproj -c Release -- content/catalog.json
          python -m unittest discover -s tests/handoff -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Push only main without force
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/main
          echo "INTEGRATED_MAIN=$(git rev-parse HEAD)"
          echo 'Only main was updated. Visual rendering is not human visual approval.'
