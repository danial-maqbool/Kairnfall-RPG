name: Opening native log diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/opening-native-log-diagnostic.yml']
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download failed opening integration evidence
        uses: actions/download-artifact@v4
        with:
          name: opening-integration-809d4de23a677c03a0b76d408810a8b7b7a6b6b4
          path: evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35033359976
      - name: Print native logs
        shell: bash
        run: |
          set -euo pipefail
          for log in import experience controls; do
            echo "===== $log.log ====="
            cat "evidence/logs/$log.log"
          done
