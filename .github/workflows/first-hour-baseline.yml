name: First-hour isolated baseline bridge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/first-hour-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: first-hour-baseline-${{ github.ref }}
  cancel-in-progress: false
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  PYTHONUTF8: '1'
  PREPARE_BLOB: ce42c83adfb9b396f66e7ec20244ed2fb38b7614
  RUNNER_BLOB: ca4638c8081dff77c47dff4dfeff12b4fbbcf987
jobs:
  opening-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated runner and execute all candidate checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,sys,urllib.request
          sha=os.environ['RUNNER_BLOB']
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Kairnfall-Preflight'})
          with urllib.request.urlopen(req,timeout=60) as response: obj=json.load(response)
          raw=base64.b64decode(''.join(obj['content'].splitlines()),validate=True)
          if obj['encoding']!='base64' or obj['sha']!=sha or hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()!=sha: raise RuntimeError('Runner identity mismatch')
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'opening-preflight';root.mkdir(exist_ok=True)
          script=root/'candidate_runner.py';script.write_bytes(raw)
          subprocess.run([sys.executable,str(script)],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-preflight-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/opening-preflight/
          retention-days: 14
          if-no-files-found: error
  export-tested-tree:
    needs: opening-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opening-preflight-Linux-${{ github.sha }}
          path: evidence
      - name: Store only verified source objects without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess,sys
          script=pathlib.Path('evidence/candidate_runner.py');raw=script.read_bytes()
          if hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()!=os.environ['RUNNER_BLOB']: raise RuntimeError('Runner changed in transfer')
          subprocess.run([sys.executable,str(script),'--export'],check=True)
          PY
