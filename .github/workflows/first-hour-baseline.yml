name: First-hour isolated baseline bridge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/first-hour-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: first-hour-baseline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  first-fight-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONUTF8: '1'
      SOURCE_BLOB: b2cfdb059d4e2b086d7b06898a80ad62382df891
      TEST_BLOB: 173661adf8b4ccaf07c6bf7762ee0a0a7e2bd162
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare exact isolated regression and candidate blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD:src/Kairnfall.Core/FirstHourExperience.cs)" = deb7ba05ea8d92d70097a2847d14d64a581e08f1
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'first-fight-preflight'
          out.mkdir()
          def fetch_blob(sha, path):
              url = f'https://api.github.com/repos/danial-maqbool/Kairnfall-RPG/git/blobs/{sha}'
              request = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'User-Agent':'Kairnfall-ReadOnly-Preflight'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  obj = json.load(response)
              if obj['encoding'] != 'base64':
                  raise RuntimeError('Unexpected blob encoding')
              raw = base64.b64decode(''.join(obj['content'].splitlines()), validate=True)
              digest = hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if digest != sha or obj['sha'] != sha or obj['size'] != len(raw):
                  raise RuntimeError('Git blob verification failed')
              raw.decode('utf-8')
              path.write_bytes(raw)
              print('Verified candidate blob', sha, path.name, len(raw))
          fetch_blob(os.environ['SOURCE_BLOB'], out/'FirstHourExperience.cs')
          target = pathlib.Path('tools/world_probe/FirstHourCombatCompletionChecks.cs')
          if target.exists():
              raise RuntimeError('Refusing to overwrite an existing test')
          fetch_blob(os.environ['TEST_BLOB'], target)
          evidence = {'checkout':os.environ['GITHUB_SHA'], 'sourceBlob':os.environ['SOURCE_BLOB'], 'testBlob':os.environ['TEST_BLOB'], 'runner':os.environ['RUNNER_OS'], 'runtimeChangesCommitted':False}
          (out/'candidate-identities.json').write_text(json.dumps(evidence, indent=2)+'\n')
          (out/'dotnet-info.txt').write_bytes(subprocess.check_output(['dotnet', '--info']))
          PY
          python tools/build_content.py > "$RUNNER_TEMP/first-fight-preflight/content.log" 2>&1
      - name: Prove historical code fails the new victory assertions
        shell: bash
        run: |
          set -euo pipefail
          set +e
          dotnet run --project tools/world_probe -c Release > "$RUNNER_TEMP/first-fight-preflight/historical-regression.log" 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo 'ERROR: historical code unexpectedly passed the new negative regression.'
            exit 1
          fi
          python - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'first-fight-preflight'
          log = (root/'historical-regression.log').read_text(errors='replace')
          expected = ('FIRST_HOUR_COMBAT_NONLETHAL:', 'FIRST_HOUR_COMBAT_SUPPORT:')
          if not all(marker in log for marker in expected):
              print(log[-20000:])
              raise RuntimeError('Historical failure was not the two intended regression assertions')
          unexpected = [line for line in log.splitlines() if line.startswith('FAIL ') and not line.startswith('FAIL FIRST FIGHT:')]
          if unexpected:
              raise RuntimeError('Unrelated historical regression failures: '+repr(unexpected))
          for line in log.splitlines():
              if line.startswith(('PASS FIRST FIGHT:', 'FAIL FIRST FIGHT:', 'FIRST_HOUR_COMBAT_COMPLETION:')):
                  print(line)
          (root/'historical-failure-classification.txt').write_text('EXPECTED REGRESSION FAILURE: successful nonlethal attacks and support casts incorrectly complete a first victory. This baseline run did not pass functional acceptance.\n')
          print('Historical regression detected the intended existing defect; this is not a baseline acceptance pass.')
          PY
      - name: Apply verified candidate only inside the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, pathlib
          source = pathlib.Path(os.environ['RUNNER_TEMP'])/'first-fight-preflight'/'FirstHourExperience.cs'
          raw = source.read_bytes()
          if hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() != os.environ['SOURCE_BLOB']:
              raise RuntimeError('Candidate changed after verification')
          pathlib.Path('src/Kairnfall.Core/FirstHourExperience.cs').write_bytes(raw)
          PY
      - name: Candidate world probe and server/client compilation must pass
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/first-fight-preflight"
          dotnet run --project tools/world_probe -c Release > "$out/candidate-world.log" 2>&1
          dotnet build Kairnfall.slnx -c Release > "$out/candidate-solution.log" 2>&1
          dotnet build client/Kairnfall.Client.csproj -c Debug > "$out/candidate-client.log" 2>&1
          python - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'first-fight-preflight'
          for name in ('candidate-world.log', 'candidate-solution.log', 'candidate-client.log'):
              text = (root/name).read_text(errors='replace')
              if re.search(r'(?m)^FAIL |ERROR:|SCRIPT ERROR:|Unhandled exception', text):
                  raise RuntimeError('Failure diagnostic in '+name)
          text = (root/'candidate-world.log').read_text(errors='replace')
          lines = [line for line in text.splitlines() if line.startswith(('PASS FIRST FIGHT:', 'FIRST_HOUR_COMBAT_COMPLETION:'))]
          if not any(line.startswith('FIRST_HOUR_COMBAT_COMPLETION: 4/4 groups;') for line in lines):
              raise RuntimeError('Permanent first-fight regression did not execute all four groups')
          print('\n'.join(lines))
          print('Candidate existing world probe, solution build and Godot client compilation passed. No new rendered-frame inspection or art acceptance is claimed.')
          PY
          git diff --check
          git status --short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-fight-preflight-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/first-fight-preflight/
          retention-days: 14
          if-no-files-found: error
