name: Final library art verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/art-library-final.yml', 'foundry/art-final-review-request.json']
permissions:
  contents: read
concurrency:
  group: art-library-final-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Apply the immutable library-only patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, re, subprocess, urllib.request
          from pathlib import Path
          out = Path('artifacts/art-library-review'); out.mkdir(parents=True, exist_ok=True)
          request = json.loads(Path('foundry/art-final-review-request.json').read_text())
          if not re.fullmatch('[0-9a-f]{40}', request['base']): raise ValueError('Full base SHA required')
          if not 1 <= len(request['patch_blobs']) <= 8 or any(not re.fullmatch('[0-9a-f]{40}', sha) for sha in request['patch_blobs']): raise ValueError('Full patch SHAs required')
          subprocess.run(['git', 'merge-base', '--is-ancestor', request['base'], 'HEAD'], check=True)
          subprocess.run(['git', 'diff', '--quiet', request['base'], 'HEAD', '--', 'atelier', 'foundry', ':(exclude)foundry/art-review-request.json', ':(exclude)foundry/art-final-review-request.json'], check=True)
          chunks = []
          for sha in request['patch_blobs']:
              url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=45) as response: blob = json.load(response)
              raw = base64.b64decode(blob['content'])
              if hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() != sha: raise ValueError('Blob integrity failed')
              chunks.append(raw)
          raw = b''.join(chunks)
          patch = gzip.decompress(raw)
          if len(patch) > 500000 or hashlib.sha256(patch).hexdigest() != request['patch_sha256']: raise ValueError('Patch integrity failed')
          path = out / 'reviewed.patch'; path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          if any(not name.startswith(('atelier/', 'foundry/')) for name in names if name): raise ValueError('Patch escaped the art libraries')
      - name: Regression, structural and byte-repeat checks
        shell: bash
        run: |
          set -euo pipefail
          python foundry/verify_repairs.py --report artifacts/art-library-review/result.json 2>&1 | tee artifacts/art-library-review/verification.log
          git diff --check
      - name: Retain verified source and PNGs in a commit object without a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, concurrent.futures, hashlib, json, os, re, subprocess, time, urllib.error, urllib.request, zipfile
          from pathlib import Path
          root = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def api(path, payload=None):
              # No refs, branches, pull requests, merges, releases or deployment operations.
              if not re.fullmatch(r'/git/(blobs|trees|commits)(/[0-9a-f]{40})?', path): raise ValueError('Git object operation only')
              data = None if payload is None else json.dumps(payload).encode()
              for attempt in range(4):
                  req = urllib.request.Request(root + path, data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response: return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429, 500, 502, 503, 504) or attempt == 3: raise
                      time.sleep(2 ** attempt)
          parent = os.environ['GITHUB_SHA']
          subprocess.run(['git', 'add', '--', 'atelier', 'foundry'], check=True)
          names = [n for n in subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0') if n]
          if not names or any(not n.startswith(('atelier/', 'foundry/')) for n in names): raise ValueError('Unexpected staged paths')
          def store(name):
              path = Path(name)
              if path.is_symlink() or not path.is_file(): raise ValueError('Ordinary source files only')
              raw = path.read_bytes()
              sha = api('/git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})['sha']
              if sha != hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest(): raise ValueError('Uploaded blob mismatch')
              return {'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: entries = list(pool.map(store, names))
          base_tree = api('/git/commits/' + parent)['tree']['sha']
          tree = api('/git/trees', {'base_tree': base_tree, 'tree': entries})['sha']
          message = 'fix(art): join cliffs, quiet terrain texture and lift nine-slice panels\n\nInclude rebuilt source PNGs, manifests, atlases, reviewed previews and deterministic regression checks. Preserve gameplay directories.\n\nCo-Authored-By: GPT 6 Pro <noreply@openai.com>'
          commit = api('/git/commits', {'message': message, 'tree': tree, 'parents': [parent]})
          out = Path('artifacts/art-library-review')
          result = {'candidate': commit['sha'], 'parent': parent, 'tree': tree, 'files': entries, 'branch_updated': False}
          (out / 'candidate.json').write_text(json.dumps(result, indent=2) + '\n')
          with zipfile.ZipFile(out / 'updates.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in names: z.write(name, name)
          print('VERIFIED_ART_CANDIDATE=' + commit['sha'])
          print('No branch was created or updated. Inspect the artifact before fast-forward integration.')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-library-final-${{ github.sha }}
          path: artifacts/art-library-review/
          if-no-files-found: error
          retention-days: 14
