name: Export Windows client

on:
  push:
    branches: [main, 'team/**']
    paths:
      - 'client/**'
      - 'src/Kairnfall.Core/**'
      - 'src/Kairnfall.Server/**'
      - 'content/**'
      - '.github/workflows/windows-release.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'src/Kairnfall.Core/**'
      - 'src/Kairnfall.Server/**'
      - 'content/**'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

concurrency:
  group: windows-export-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable.mono
  GODOT_EDITOR_SHA256: 129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247
  GODOT_TEMPLATES_SHA256: 92f8681e349ef1f90891b792da95e3b2b0bd1ed610b78018c58feb2d87e15a9d

jobs:
  export-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kairnfall_smoke
          POSTGRES_PASSWORD: disposable-smoke-database-only
          POSTGRES_DB: kairnfall_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairnfall_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KAIRNFALL_DB: Host=127.0.0.1;Port=5432;Database=kairnfall_smoke;Username=kairnfall_smoke;Password=disposable-smoke-database-only
      KAIRNFALL_ALLOW_LOCAL_HTTP: '1'
      ASPNETCORE_ENVIRONMENT: Testing
      ASPNETCORE_URLS: http://127.0.0.1:5077
      KAIRNFALL_SMOKE_URL: http://127.0.0.1:5077
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download verified Godot .NET editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/godot-4.7.2"
          mkdir -p "$cache"
          curl -fL --retry 4 --retry-delay 3 \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v4.7.2-stable_mono_linux_x86_64.zip" \
            -o "$cache/editor.zip"
          curl -fL --retry 4 --retry-delay 3 \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v4.7.2-stable_mono_export_templates.tpz" \
            -o "$cache/templates.tpz"
          echo "$GODOT_EDITOR_SHA256  $cache/editor.zip" | sha256sum --check --strict
          echo "$GODOT_TEMPLATES_SHA256  $cache/templates.tpz" | sha256sum --check --strict

      - name: Install Godot and matching .NET export templates
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/godot-4.7.2"
          rm -rf "$cache/editor" "$cache/templates-unpacked"
          mkdir -p "$cache/editor" "$cache/templates-unpacked"
          unzip -q "$cache/editor.zip" -d "$cache/editor"
          unzip -q "$cache/templates.tpz" -d "$cache/templates-unpacked"
          template_source="$cache/templates-unpacked/templates"
          test -d "$template_source"
          template_target="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          mkdir -p "$template_target"
          cp -a "$template_source/." "$template_target/"
          godot_exe="$(find "$cache/editor" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$godot_exe"
          chmod +x "$godot_exe"
          echo "GODOT_EXE=$godot_exe" >> "$GITHUB_ENV"
          "$godot_exe" --version
          test -f "$template_target/windows_release_x86_64.exe"

      - name: Build server, core, tests, and client source
        shell: bash
        run: dotnet build Kairnfall.slnx -c Release && dotnet build client/Kairnfall.Client.csproj -c Release

      - name: Load project in Godot headless editor
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_EXE" --headless --editor --path "$GITHUB_WORKSPACE/client" --quit

      - name: Run live Godot client-to-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          dotnet src/Kairnfall.Server/bin/Release/net10.0/Kairnfall.Server.dll > artifacts/logs/smoke-server.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5077/health > artifacts/logs/smoke-health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat artifacts/logs/smoke-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat artifacts/logs/smoke-server.log
            exit 1
          fi
          set +e
          "$GODOT_EXE" --headless --path "$GITHUB_WORKSPACE/client" -- --smoke 2>&1 | tee artifacts/logs/godot-smoke.log
          smoke_status=${PIPESTATUS[0]}
          set -e
          cat artifacts/logs/smoke-health.json
          if [ "$smoke_status" -ne 0 ]; then
            cat artifacts/logs/smoke-server.log
            exit "$smoke_status"
          fi
          grep -F "SMOKE: authenticated Godot client entered the persistent server." artifacts/logs/godot-smoke.log
          grep -F "SMOKE: live world, inventory, skills, and map rendered without missing requested assets." artifacts/logs/godot-smoke.log

      - name: Export Windows x86-64 release
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/build/client/Kairnfall.exe"
          mkdir -p "$(dirname "$output")"
          "$GODOT_EXE" --headless --path "$GITHUB_WORKSPACE/client" --export-release "Windows Desktop" "$output"
          test -f "$output"
          file_count="$(find "$(dirname "$output")" -type f | wc -l)"
          test "$file_count" -ge 2
          find "$(dirname "$output")" -type f -printf '%P %s bytes\n' | sort

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kairnfall-Windows-${{ github.sha }}
          path: |
            build/client/
            artifacts/logs/
          retention-days: 14
          if-no-files-found: error
