name: Export Windows client

on:
  push:
    branches: [main, 'team/**']
    paths:
      - 'client/**'
      - 'src/Kairnfall.Core/**'
      - 'content/**'
      - '.github/workflows/windows-release.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'src/Kairnfall.Core/**'
      - 'content/**'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

concurrency:
  group: windows-export-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable.mono
  GODOT_EDITOR_SHA256: 129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247
  GODOT_TEMPLATES_SHA256: 92f8681e349ef1f90891b792da95e3b2b0bd1ed610b78018c58feb2d87e15a9d

jobs:
  export-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download verified Godot .NET editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/godot-4.7.2"
          mkdir -p "$cache"
          curl -fL --retry 4 --retry-delay 3 \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v4.7.2-stable_mono_linux_x86_64.zip" \
            -o "$cache/editor.zip"
          curl -fL --retry 4 --retry-delay 3 \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v4.7.2-stable_mono_export_templates.tpz" \
            -o "$cache/templates.tpz"
          echo "$GODOT_EDITOR_SHA256  $cache/editor.zip" | sha256sum --check --strict
          echo "$GODOT_TEMPLATES_SHA256  $cache/templates.tpz" | sha256sum --check --strict

      - name: Install Godot and matching .NET export templates
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/godot-4.7.2"
          rm -rf "$cache/editor" "$cache/templates-unpacked"
          mkdir -p "$cache/editor" "$cache/templates-unpacked"
          unzip -q "$cache/editor.zip" -d "$cache/editor"
          unzip -q "$cache/templates.tpz" -d "$cache/templates-unpacked"
          template_source="$cache/templates-unpacked/templates"
          test -d "$template_source"
          template_target="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          mkdir -p "$template_target"
          cp -a "$template_source/." "$template_target/"
          godot_exe="$(find "$cache/editor" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$godot_exe"
          chmod +x "$godot_exe"
          echo "GODOT_EXE=$godot_exe" >> "$GITHUB_ENV"
          "$godot_exe" --version
          test -f "$template_target/windows_release_x86_64.exe"

      - name: Build client C# source
        shell: bash
        run: dotnet build client/Kairnfall.Client.csproj -c Release

      - name: Load project in Godot headless editor
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_EXE" --headless --editor --path "$GITHUB_WORKSPACE/client" --quit

      - name: Export Windows x86-64 release
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/build/client/Kairnfall.exe"
          mkdir -p "$(dirname "$output")"
          "$GODOT_EXE" --headless --path "$GITHUB_WORKSPACE/client" --export-release "Windows Desktop" "$output"
          test -f "$output"
          file_count="$(find "$(dirname "$output")" -type f | wc -l)"
          test "$file_count" -ge 2
          find "$(dirname "$output")" -type f -printf '%P %s bytes\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: Kairnfall-Windows-${{ github.sha }}
          path: build/client/
          retention-days: 14
          if-no-files-found: error
