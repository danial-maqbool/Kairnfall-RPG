name: Verify exact player-experience candidate
on:
  push:
    branches: [main]
    paths:
      - '.ci/experience-candidate.json'
      - '.github/workflows/experience-candidate.yml'
permissions:
  contents: read
concurrency:
  group: experience-candidate
  cancel-in-progress: true
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      base: ${{ steps.select.outputs.base }}
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: select
        name: Validate the explicit same-repository candidate
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          request = json.loads(Path('.ci/experience-candidate.json').read_text())
          for key in ('sha', 'base'):
              if not re.fullmatch(r'[0-9a-f]{40}', request.get(key, '')):
                  raise SystemExit('Expected an exact commit SHA: ' + key)
          if request.get('mode') not in ('baseline', 'repair'):
              raise SystemExit('Unknown candidate mode')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('sha', 'base', 'mode'):
                  output.write(key + '=' + request[key] + '\n')
          print('Candidate:', request['sha'])
          print('This workflow tests this candidate, not an unrelated main revision.')
          PY
  verify:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kairnfall_test
          POSTGRES_PASSWORD: disposable-ci-database-only
          POSTGRES_DB: kairnfall_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kairnfall_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KAIRNFALL_TEST_DB: Host=127.0.0.1;Port=5432;Database=kairnfall_test;Username=kairnfall_test;Password=disposable-ci-database-only
      KAIRNFALL_ALLOW_DB_TESTS: '1'
      KAIRNFALL_ALLOW_LOCAL_HTTP: '1'
      ASPNETCORE_ENVIRONMENT: Testing
      LIBGL_ALWAYS_SOFTWARE: '1'
      CANDIDATE_BASE: ${{ needs.select.outputs.base }}
      CANDIDATE_MODE: ${{ needs.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify ancestry and record the tested revision
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CANDIDATE_BASE" HEAD
          mkdir -p artifacts/experience/logs artifacts/experience/screenshots
          git rev-parse HEAD | tee artifacts/experience/revision.txt
          git status --porcelain
      - name: Rebuild deterministic content and compile source
        run: |
          set -euo pipefail
          python tools/build_content.py | tee artifacts/experience/logs/content.log
          dotnet build Kairnfall.slnx -c Release | tee artifacts/experience/logs/build.log
          dotnet build client/Kairnfall.Client.csproj -c Debug | tee artifacts/experience/logs/client-build.log
      - name: Run retained backend, security, world, and database suites
        run: |
          set -euo pipefail
          dotnet run --no-build --project tests/Kairnfall.Tests/Kairnfall.Tests.csproj -c Release -- content/catalog.json | tee artifacts/experience/logs/core.log
          dotnet run --no-build --project tests/Kairnfall.ReviewTests/Kairnfall.ReviewTests.csproj -c Release | tee artifacts/experience/logs/review.log
          dotnet run --project tests/Kairnfall.SecurityTests/Kairnfall.SecurityTests.csproj -c Release -- content/catalog.json | tee artifacts/experience/logs/security.log
          dotnet run --no-build --project tools/security_probe/SecurityProbe.csproj -c Release -- content/catalog.json | tee artifacts/experience/logs/security-probe.log
          dotnet run --no-build --project tools/world_probe/world_probe.csproj -c Release | tee artifacts/experience/logs/world.log
          dotnet run --no-build --project tests/Kairnfall.Integration/Kairnfall.Integration.csproj -c Release | tee artifacts/experience/logs/network.log
          dotnet run --no-build --project tests/Kairnfall.ReviewTests/Kairnfall.ReviewTests.csproj -c Release -- --database | tee artifacts/experience/logs/database.log
          python -m unittest discover -s tests/handoff -p 'test_*.py' -v 2>&1 | tee artifacts/experience/logs/handoff.log
      - name: Reconstruct the canonical asset pack and verified editor
        run: |
          set -euo pipefail
          python -m pip install Pillow==12.0.0
          python tools/build_game_assets.py | tee artifacts/experience/logs/assets.log
          python tools/complete_skill_icons.py | tee artifacts/experience/logs/skill-icons.log
          python tools/validate_game_assets.py | tee artifacts/experience/logs/asset-validation.log
          python tools/get_godot.py --os linux | tee artifacts/experience/logs/editor.log
      - name: Run native Godot contracts
        run: |
          set -euo pipefail
          timeout 180 "$GODOT_BIN" --headless --editor --path client --import 2>&1 | tee artifacts/experience/logs/import.log
          timeout 90 "$GODOT_BIN" --headless --path client res://Tests/SignalContract.tscn 2>&1 | tee artifacts/experience/logs/signals.log
          timeout 90 "$GODOT_BIN" --headless --path client res://Tests/InputContract.tscn 2>&1 | tee artifacts/experience/logs/input.log
          if [ "$CANDIDATE_MODE" = repair ]; then
            test -f client/Tests/PlayerExperienceContract.tscn
            timeout 120 "$GODOT_BIN" --headless --path client res://Tests/PlayerExperienceContract.tscn 2>&1 | tee artifacts/experience/logs/experience.log
          fi
          if grep -E '(^|[[:space:]])(ERROR:|SCRIPT ERROR:|Unhandled exception)' artifacts/experience/logs/{import,signals,input}.log; then exit 1; fi
          if [ -f artifacts/experience/logs/experience.log ] && grep -E '(^|[[:space:]])(ERROR:|SCRIPT ERROR:|Unhandled exception)' artifacts/experience/logs/experience.log; then exit 1; fi
      - name: Render a real client against a separate disposable realm
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          KAIRNFALL_DB: Host=127.0.0.1;Port=5432;Database=kairnfall_visual;Username=kairnfall_test;Password=disposable-ci-database-only
          ASPNETCORE_URLS: http://127.0.0.1:5077
          KAIRNFALL_SCREENSHOTS: ${{ github.workspace }}/artifacts/experience/screenshots
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" psql -U kairnfall_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE kairnfall_visual;'
          dotnet src/Kairnfall.Server/bin/Release/net10.0/Kairnfall.Server.dll > artifacts/experience/logs/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5077/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5077/health
          timeout 120 xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_BIN" --path client --rendering-method gl_compatibility --audio-driver Dummy -- --smoke 2>&1 | tee artifacts/experience/logs/live-client.log
          for image in 01-world 02-inventory 03-skills 04-map; do test -s "artifacts/experience/screenshots/$image.png"; done
          if grep -E '(^|[[:space:]])(ERROR:|SCRIPT ERROR:|Unhandled exception)' artifacts/experience/logs/live-client.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-experience-${{ needs.select.outputs.sha }}
          path: artifacts/experience/
          retention-days: 14
          if-no-files-found: error
