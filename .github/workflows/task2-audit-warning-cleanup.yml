name: Finalize Task 2 audit warning cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task2-audit-warning-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove audit-only nullability warnings and self-delete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/world_probe/RealActivityProgressionChecks.cs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'string weapon = player.Equipment.GetValueOrDefault("weapon");': 'string weapon = player.Equipment.GetValueOrDefault("weapon")!;',
              'string chest = player.Equipment.GetValueOrDefault("chest");': 'string chest = player.Equipment.GetValueOrDefault("chest")!;',
              'string equipped = p.Equipment.GetValueOrDefault("weapon");': 'string equipped = p.Equipment.GetValueOrDefault("weapon")!;',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/world_probe/RealActivityProgressionChecks.cs
          git rm .github/workflows/task2-audit-warning-cleanup.yml
          git commit -m 'test(progression): remove Task 2 audit warnings'
          git push origin HEAD:main
