name: Grounded actor acceptance
on:
  push:
    branches: [main]
    paths:
      - 'atelier/forge/grounded_*.py'
      - 'tools/art/people.py'
      - 'tools/art/fauna.py'
      - 'tools/integrate_atelier.py'
      - 'tools/build_game_assets.py'
      - 'tools/validate_game_assets.py'
      - 'tools/validate_grounded_actor_assets.py'
      - 'content_src/**'
      - 'client/Scripts/PixelAssets.cs'
      - 'client/Scripts/WorldView*.cs'
      - 'client/Tests/VisualPresentationContract.*'
      - '.github/workflows/grounded-actor-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grounded-actor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild exact actor runtime pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/grounded-actors/logs artifacts/grounded-actors/screenshots
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > artifacts/grounded-actors/revision.txt
          python -m pip install Pillow==12.0.0
          python tools/build_content.py 2>&1 | tee artifacts/grounded-actors/logs/content.log
          dotnet build client/Kairnfall.Client.csproj -c Debug 2>&1 | tee artifacts/grounded-actors/logs/client-build.log
          python tools/build_game_assets.py 2>&1 | tee artifacts/grounded-actors/logs/assets.log
          python tools/complete_skill_icons.py 2>&1 | tee artifacts/grounded-actors/logs/skill-icons.log
          python tools/validate_game_assets.py 2>&1 | tee artifacts/grounded-actors/logs/general-validation.log
          python tools/validate_grounded_actor_assets.py 2>&1 | tee artifacts/grounded-actors/logs/actor-validation.log
          python tools/get_godot.py --os linux 2>&1 | tee artifacts/grounded-actors/logs/godot.log
      - name: Measure actor runtime footprint
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('client/Assets')
          groups=('people','equipment','npcs','mobs')
          sizes={group:sum(p.stat().st_size for p in (root/group).glob('*.png')) for group in groups}
          counts={group:len(list((root/group).glob('*.png'))) for group in groups}
          report={'revision':Path('artifacts/grounded-actors/revision.txt').read_text().strip(),'bytes':sizes,'counts':counts,
                  'totalActorBytes':sum(sizes.values()),'visualApproval':'not implied by measurement'}
          Path('artifacts/grounded-actors/footprint.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Inspect native-size actor presentation
        shell: bash
        env:
          KAIRNFALL_SCREENSHOTS: ${{ github.workspace }}/artifacts/grounded-actors/screenshots
        run: |
          set -euo pipefail
          timeout 180 "$GODOT_BIN" --headless --editor --path client --import > artifacts/grounded-actors/logs/import.log 2>&1
          timeout 240 xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_BIN" --path client --rendering-method gl_compatibility --audio-driver Dummy res://Tests/VisualPresentationContract.tscn > artifacts/grounded-actors/logs/native-visual.log 2>&1
          for log in import native-visual; do
            if grep -E '(^|[[:space:]])(ERROR:|SCRIPT ERROR:|Unhandled exception)' "artifacts/grounded-actors/logs/$log.log"; then exit 1; fi
          done
          test -s artifacts/grounded-actors/screenshots/02-player-walk.png
          test -s artifacts/grounded-actors/screenshots/03-player-attack.png
          test -s artifacts/grounded-actors/screenshots/04-player-cast.png
          test -s artifacts/grounded-actors/screenshots/equipment-state-5-frame-7.png
          test -s artifacts/grounded-actors/screenshots/mobs-state-5-frame-7.png
          grep -F 'VISUAL_PRESENTATION_CONTRACT:' artifacts/grounded-actors/logs/native-visual.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grounded-actors-${{ github.sha }}
          path: artifacts/grounded-actors/
          retention-days: 14
          if-no-files-found: error
