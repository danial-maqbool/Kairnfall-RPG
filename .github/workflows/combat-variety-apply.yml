name: Verify and apply combat variety

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/combat-variety-apply.yml'
      - 'tools/apply_combat_variety_update.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply combat-variety source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_combat_variety_update.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('content_src/mobs.py')
          text=p.read_text(encoding='utf-8')
          old="'healer':['projectile']"
          if old not in text:
              raise SystemExit('healer attack profile anchor missing')
          p.write_text(text.replace(old,"'healer':['projectile','root']",1),encoding='utf-8')
          PY
          python3 tools/build_content.py
      - name: Verify combat behavior, content, server, and client compile
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Kairnfall.slnx -c Release
          dotnet run --no-build --project tools/world_probe/world_probe.csproj -c Release
          dotnet build client/Kairnfall.Client.csproj -c Debug
          git diff --check
      - name: Publish verified update and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/combat-variety-apply.yml tools/apply_combat_variety_update.py
          git add -A
          git commit -m 'feat: diversify enemy combat behavior'
          git pull --rebase origin main
          git push origin HEAD:main
