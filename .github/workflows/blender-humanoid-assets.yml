name: Blender humanoid asset sync

on:
  push:
    branches: [main]
    paths:
      - 'tools/art/blender_humanoid_batch.py'
      - 'tools/art/blender_humanoid_workbench.py'
      - 'tools/art/assemble_blender_humanoid.py'
      - 'atelier/forge/blender_body.py'
      - 'atelier/forge/__init__.py'
      - 'atelier/tests/test_refined_body_batch01.py'
      - '.github/workflows/blender-humanoid-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blender-humanoid-main
  cancel-in-progress: true

jobs:
  render-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto current main
        shell: bash
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render and sheet dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y blender libegl1 libgl1 libgl1-mesa-dri
          python -m pip install Pillow==12.0.0
          blender --version
      - name: Render 3D humanoid master frames
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
        run: |
          rm -rf artifacts/blender-humanoid
          mkdir -p artifacts/blender-humanoid
          blender -b --python tools/art/blender_humanoid_workbench.py -- --output artifacts/blender-humanoid/frames
      - name: Compile authored 8x24 sheets
        shell: bash
        run: |
          rm -rf atelier/authored/humanoid
          python tools/art/assemble_blender_humanoid.py artifacts/blender-humanoid/frames atelier/authored/humanoid
      - name: Validate authored master batch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          root = Path('atelier/authored/humanoid')
          files = sorted(root.glob('body_*.png'))
          if len(files) != 12:
              raise SystemExit(f'Expected 12 authored humanoid sheets, found {len(files)}')
          for path in files:
              with Image.open(path) as image:
                  if image.mode != 'RGBA' or image.size != (512, 1536):
                      raise SystemExit(f'Bad authored sheet contract: {path} {image.mode} {image.size}')
                  unique = set()
                  for row in range(24):
                      for col in range(8):
                          frame = image.crop((col*64, row*64, (col+1)*64, (row+1)*64))
                          alpha = frame.getchannel('A')
                          bbox = alpha.getbbox()
                          if bbox is None:
                              raise SystemExit(f'Blank authored frame: {path} row={row} col={col}')
                          opaque = sum(1 for value in alpha.getdata() if value >= 128)
                          if opaque < 90:
                              raise SystemExit(f'Under-defined authored frame: {path} row={row} col={col} pixels={opaque}')
                          unique.add(hashlib.sha256(frame.tobytes()).digest())
                  if len(unique) <= 100:
                      raise SystemExit(f'Insufficient authored animation variation: {path} {len(unique)}')
          print('Validated 12 Blender-authored humanoid sheets.')
          PY
      - name: Regenerate Atelier people assets from authored masters
        shell: bash
        run: |
          python atelier/build.py --only people --jobs 1
          python -m unittest atelier.tests.test_refined_body_batch01 -v
      - name: Guard unrelated people layers
        shell: bash
        run: |
          if ! git diff --quiet -- atelier/Assets/people ':(exclude)atelier/Assets/people/body_*.png'; then
            echo 'Blender base-body pass changed non-body people layers.' >&2
            git diff --stat -- atelier/Assets/people
            exit 1
          fi
      - name: Validate generated base sheets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          root = Path('atelier/Assets/people')
          files = sorted(root.glob('body_*.png'))
          if len(files) != 12:
              raise SystemExit(f'Expected 12 generated base sheets, found {len(files)}')
          for path in files:
              with Image.open(path) as image:
                  if image.mode != 'RGBA' or image.size != (512, 1536):
                      raise SystemExit(f'Bad generated sheet contract: {path} {image.mode} {image.size}')
                  hashes = set()
                  for row in range(24):
                      for col in range(8):
                          frame = image.crop((col*64, row*64, (col+1)*64, (row+1)*64))
                          if frame.getchannel('A').getbbox() is None:
                              raise SystemExit(f'Blank generated frame: {path} row={row} col={col}')
                          hashes.add(hashlib.sha256(frame.tobytes()).digest())
                  if len(hashes) <= 100:
                      raise SystemExit(f'Insufficient animation variation: {path} {len(hashes)}')
          print('Validated regenerated Blender humanoid base batch.')
          PY
          git diff --check
      - name: Commit authored masters and generated batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atelier/authored/humanoid/body_*.png atelier/Assets/people/body_*.png atelier/Assets/manifest.json
          if git diff --cached --quiet; then
            echo 'Blender-authored assets already match the repository.'
            exit 0
          fi
          git commit -m 'art: publish Blender-authored humanoid base sprites'
          git pull --rebase origin main
          git push origin HEAD:main
