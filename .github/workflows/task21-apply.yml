name: Temporary Task 21 patch applicator
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task21-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply Task 21 source patch
        run: python3 tools/task21_apply_fixed.py
      - name: Generate deterministic content
        run: python3 tools/build_content.py
      - name: Compile solution
        run: dotnet build Kairnfall.slnx -c Release
      - name: Run world and Task 21 regressions
        run: dotnet run --no-build --project tools/world_probe/world_probe.csproj -c Release
      - name: Commit production implementation and remove temporary tooling
        run: |
          git config user.name 'Kairnfall CI'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/task21-apply.yml tools/task21_apply.py tools/task21_apply_fixed.py
          git add -A
          git commit -m 'Task 21: deepen compact dungeons and harden boss resets'
          git push origin HEAD:main
