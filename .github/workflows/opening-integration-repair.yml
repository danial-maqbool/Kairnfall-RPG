name: Repair opening integration replay
on:
  push:
    branches: [main]
    paths: ['.github/workflows/opening-integration-repair.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: opening-integration-repair-main
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep immutable candidate worktree clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/opening-integration.yml')
          text=path.read_text(encoding='utf-8')
          old="""          evidence=candidate/'candidate-evidence'; evidence.mkdir(parents=True,exist_ok=True)\n          env=os.environ.copy(); env.update(GITHUB_SHA=os.environ['OPENING_BASE'],GITHUB_REPOSITORY=repo,GH_TOKEN=token,RUNNER_TEMP=str(evidence))\n          script=candidate/'prepare.py'; script.write_bytes(raw)\n"""
          new="""          evidence=candidate.parent/'opening-prepare-evidence'; evidence.mkdir(parents=True,exist_ok=True)\n          env=os.environ.copy(); env.update(GITHUB_SHA=os.environ['OPENING_BASE'],GITHUB_REPOSITORY=repo,GH_TOKEN=token,RUNNER_TEMP=str(evidence))\n          script=evidence/'prepare.py'; script.write_bytes(raw)\n"""
          if text.count(old)!=1:
              raise RuntimeError('Opening integration replay block no longer matches the audited failure.')
          path.write_text(text.replace(old,new),encoding='utf-8',newline='\n')
          PY
          git diff --check
          git diff -- .github/workflows/opening-integration.yml
      - name: Commit and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/opening-integration.yml
          git commit -m 'fix(ci): keep immutable opening worktree clean during replay'
          git push origin HEAD:main
