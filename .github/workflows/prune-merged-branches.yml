name: Prune merged branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-merged-branches.yml'
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete merged historical branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'fix/simple-xp-loot-expiry'
            'team/acceptance-01-live-xp'
            'team/acceptance-02-full-progression'
            'team/acceptance-03-visual-matrix'
            'team/acceptance-04-world-quest'
            'team/acceptance-05-economy-balance'
            'team/acceptance-06-audio'
            'team/acceptance-07-graphical-multiplayer'
            'team/acceptance-08-load'
            'team/acceptance-09-windows-dpi-input'
            'team/acceptance-10-windows-package'
            'team/fix-xp-hud-contract'
            'team/rarity-elements-boss-uniques'
            'team/xp-human-sprites'
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
          remaining="$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | grep -v '^main$' || true)"
          if [ -n "$remaining" ]; then
            echo 'Unexpected branches remain:' >&2
            echo "$remaining" >&2
            exit 1
          fi
          echo 'Only main remains.'
