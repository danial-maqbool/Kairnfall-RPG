name: Verify and apply exploration rewards

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/exploration-rewards-apply.yml'
      - 'tools/apply_exploration_rewards_update.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply exploration-reward source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_exploration_rewards_update.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/world_probe/ExplorationRewardChecks.cs')
          text=p.read_text(encoding='utf-8')
          text=text.replace('var landmark=ExplorationRewards.Landmarks(zone)[0];p.Position=JourneyProgression.LandmarkPoint(landmark);\n            var revisit=realm.Execute(p.Id,new GameCommand{Kind="inspect",Target=landmark.Id,Sequence=p.LastAction+1});',
                            'var firstLandmark=ExplorationRewards.Landmarks(zone)[0];p.Position=JourneyProgression.LandmarkPoint(firstLandmark);\n            var revisit=realm.Execute(p.Id,new GameCommand{Kind="inspect",Target=firstLandmark.Id,Sequence=p.LastAction+1});')
          old='''        Test("charting counts real terrain sectors rather than landmark metadata",()=>
        {
            var zone=regions[0];var realm=new RealmEngine(data);var p=realm.CreateCharacter("exploration-chart","Chart Tester","vanguard",new());p.Zone=zone.Id;p.Position=zone.Spawn;
            foreach(var landmark in ExplorationRewards.Landmarks(zone))p.Discoveries.Add(ExplorationRewards.LandmarkKey(zone,landmark));
            Items.Add(p.Inventory,Items.Create(data,"parchment"),data);Items.Add(p.Inventory,Items.Create(data,"ink"),data);
            var rejected=realm.Execute(p.Id,new GameCommand{Kind="chart",Sequence=p.LastAction+1});Need(!rejected.Ok,"Landmark metadata falsely satisfied map-sector charting.");
            for(int i=0;i<ExplorationRewards.RequiredChartSectors;i++)p.Discoveries.Add($"{zone.Id}:{i}:0");
            var accepted=realm.Execute(p.Id,new GameCommand{Kind="chart",Sequence=p.LastAction+1});Need(accepted.Ok&&ExplorationRewards.Charted(p,zone),"Real sector discoveries did not permit charting: "+accepted.Message);
        });'''
          new='''        Test("charting counts real terrain sectors rather than landmark metadata",()=>
        {
            var zone=regions[0];
            {
                var realm=new RealmEngine(data);var p=realm.CreateCharacter("exploration-chart-reject","Chart Reject","vanguard",new());p.Zone=zone.Id;p.Position=zone.Spawn;
                foreach(var marker in ExplorationRewards.Landmarks(zone))p.Discoveries.Add(ExplorationRewards.LandmarkKey(zone,marker));
                Items.Add(p.Inventory,Items.Create(data,"parchment"),data);Items.Add(p.Inventory,Items.Create(data,"ink"),data);
                var rejected=realm.Execute(p.Id,new GameCommand{Kind="chart",Sequence=p.LastAction+1});Need(!rejected.Ok,"Landmark metadata falsely satisfied map-sector charting.");
            }
            {
                var realm=new RealmEngine(data);var p=realm.CreateCharacter("exploration-chart-accept","Chart Accept","vanguard",new());p.Zone=zone.Id;p.Position=zone.Spawn;
                foreach(var marker in ExplorationRewards.Landmarks(zone))p.Discoveries.Add(ExplorationRewards.LandmarkKey(zone,marker));
                for(int i=0;i<ExplorationRewards.RequiredChartSectors;i++)p.Discoveries.Add($"{zone.Id}:{i}:0");
                Items.Add(p.Inventory,Items.Create(data,"parchment"),data);Items.Add(p.Inventory,Items.Create(data,"ink"),data);
                var accepted=realm.Execute(p.Id,new GameCommand{Kind="chart",Sequence=p.LastAction+1});var authoritative=realm.Player(p.Id);
                Need(accepted.Ok&&ExplorationRewards.Charted(authoritative,zone),"Real sector discoveries did not permit charting: "+accepted.Message);
            }
        });'''
          if old not in text:
              raise SystemExit('chart regression block not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          python3 tools/build_content.py
      - name: Verify authoritative exploration loop, server, and client
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Kairnfall.slnx -c Release
          dotnet run --no-build --project tools/world_probe/world_probe.csproj -c Release
          dotnet build client/Kairnfall.Client.csproj -c Debug
          git diff --check
      - name: Rebuild and validate deterministic art including regional keepsakes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/build_game_assets.py
          python3 tools/complete_skill_icons.py
          python3 tools/validate_game_assets.py
      - name: Publish verified update and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/exploration-rewards-apply.yml tools/apply_exploration_rewards_update.py
          git add -A
          git commit -m 'feat: reward regional exploration mastery'
          git pull --rebase origin main
          git push origin HEAD:main
