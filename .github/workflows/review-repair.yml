name: Apply and verify reviewed gameplay repairs
on:
  push:
    branches: ['team/qa/combat-equipment-repair']
    paths:
      - '.github/workflows/review-repair.yml'
      - 'tools/apply_review_batch.py'
      - 'tests/Kairnfall.ReviewTests/**'
      - 'src/Kairnfall.Core/HandEquipment.cs'
      - 'src/Kairnfall.Core/WorldEventLifecycle.cs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kairnfall-reviewed-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/team/qa/combat-equipment-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kairnfall_test
          POSTGRES_PASSWORD: disposable-ci-database-only
          POSTGRES_DB: kairnfall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairnfall_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KAIRNFALL_TEST_DB: Host=127.0.0.1;Port=5432;Database=kairnfall_test;Username=kairnfall_test;Password=disposable-ci-database-only
      KAIRNFALL_ALLOW_DB_TESTS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check preimages and apply the reviewed source patch
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs artifacts/test-results
          python3 tools/apply_review_batch.py | tee artifacts/logs/review-apply.log
          git diff --check
          git diff -- src > artifacts/review-source.patch
      - name: Generate the existing content catalog
        run: python3 tools/build_content.py | tee artifacts/logs/review-content.log
      - name: Compile the persistent server
        run: dotnet build src/Kairnfall.Server/Kairnfall.Server.csproj -c Release | tee artifacts/logs/review-build.log
      - name: Preserve the existing core regression gates
        run: dotnet run --project tests/Kairnfall.Tests/Kairnfall.Tests.csproj -c Release -- content/catalog.json | tee artifacts/logs/review-existing-core.log
      - name: Run the new gameplay and malformed-input regressions
        run: dotnet run --project tests/Kairnfall.ReviewTests/Kairnfall.ReviewTests.csproj -c Release | tee artifacts/logs/review-core.log
      - name: Recheck real multiplayer and PostgreSQL persistence
        run: dotnet run --project tests/Kairnfall.Integration/Kairnfall.Integration.csproj -c Release | tee artifacts/logs/review-network.log
      - name: Run isolated PostgreSQL save-conflict regressions
        run: dotnet run --project tests/Kairnfall.ReviewTests/Kairnfall.ReviewTests.csproj -c Release -- --database | tee artifacts/logs/review-database.log
      - name: Commit only the tested source changes to the isolated branch
        run: |
          set -euo pipefail
          branch='team/qa/combat-equipment-repair'
          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo 'The branch changed during validation. Refusing to overwrite it.'
            exit 1
          fi
          git add -- src/Kairnfall.Core/Models.cs src/Kairnfall.Core/Mechanics.cs src/Kairnfall.Core/RealmCombat.cs src/Kairnfall.Core/RealmEngine.cs src/Kairnfall.Server/RealmStore.cs docs/reviews/repair-source-manifest.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(gameplay): preserve attack skills and enforce equipment, event, and save invariants'
            git push origin "HEAD:refs/heads/$branch"
          fi
          git rev-parse HEAD | tee artifacts/review-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-repair-evidence-${{ github.run_id }}
          path: |
            artifacts/logs/
            artifacts/test-results/
            artifacts/review-source.patch
            artifacts/review-commit.txt
            docs/reviews/repair-source-manifest.json
          retention-days: 7
          if-no-files-found: error
