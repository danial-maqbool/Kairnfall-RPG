name: Review exact visual candidate
on:
  push:
    branches: [main]
    paths: ['.ci/experience-candidate.json', '.github/workflows/visual-review.yml']
permissions:
  contents: read
concurrency:
  group: visual-review
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      candidate: ${{ steps.select.outputs.candidate }}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        name: Select immutable visual revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          value=json.loads(Path('.ci/experience-candidate.json').read_text())['sha']
          if not re.fullmatch('[0-9a-f]{40}',value): raise SystemExit('Invalid candidate revision')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('candidate='+value+'\n')
          PY
          git checkout --detach '${{ steps.select.outputs.candidate }}'
      - name: Check out selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.select.outputs.candidate }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and construct visual assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/experience/visual/logs
          git rev-parse HEAD > artifacts/experience/visual/revision.txt
          test -z "$(git status --porcelain)"
          test -f client/Tests/VisualPresentationContract.tscn
          python -m pip install Pillow==12.0.0
          python tools/build_content.py
          dotnet build client/Kairnfall.Client.csproj -c Debug 2>&1 | tee artifacts/experience/visual/logs/build.log
          python -m unittest discover -s tests/handoff -p 'test_visual*.py' -v 2>&1 | tee artifacts/experience/visual/logs/art-tests.log
          python tools/build_game_assets.py 2>&1 | tee artifacts/experience/visual/logs/assets.log
          python tools/complete_skill_icons.py
          python tools/validate_game_assets.py 2>&1 | tee artifacts/experience/visual/logs/validation.log
          python tools/get_godot.py --os linux
      - name: Render original and revised source sheets
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach artifacts/visual-before dcc84f50fe2c5f1dcff616df97c9e1ac7112c2c4
          python artifacts/visual-before/tools/build_content.py
          python tools/review_visual_art.py --source-root artifacts/visual-before --catalog artifacts/visual-before/content/catalog.json --output artifacts/experience/visual/before
          python tools/review_visual_art.py --output artifacts/experience/visual/after
      - name: Render actual Godot presentation fixtures
        shell: bash
        env:
          KAIRNFALL_SCREENSHOTS: ${{ github.workspace }}/artifacts/experience/visual/engine
        run: |
          set -euo pipefail
          timeout 180 "$GODOT_BIN" --headless --editor --path client --import 2>&1 | tee artifacts/experience/visual/logs/import.log
          timeout 180 xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_BIN" --path client --rendering-method gl_compatibility --audio-driver Dummy res://Tests/VisualPresentationContract.tscn 2>&1 | tee artifacts/experience/visual/logs/native-visual.log
          if grep -E '(^|[[:space:]])(ERROR:|SCRIPT ERROR:|Unhandled exception)' artifacts/experience/visual/logs/{import,native-visual}.log; then exit 1; fi
          test -s artifacts/experience/visual/engine/ui-inventory-1280.png
          test -s artifacts/experience/visual/engine/equipment-state-5-frame-7.png
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ steps.select.outputs.candidate }}
          path: artifacts/experience/visual/
          retention-days: 14
          if-no-files-found: error
  previews:
    if: always() && needs.render.outputs.candidate != ''
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: visual-review-${{ needs.render.outputs.candidate }}
          path: evidence
      - name: Print bounded diagnostics and store sanitized PNG preview objects
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.render.outputs.candidate }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          from pathlib import Path
          root=Path('evidence')
          for name in ('build.log','art-tests.log','assets.log','validation.log','native-visual.log'):
              for path in root.rglob(name):
                  lines=path.read_text(encoding='utf-8',errors='replace').splitlines()
                  print('\n=== '+name+' ===\n'+'\n'.join(lines[-65:])[-14000:])
          candidate=os.environ['CANDIDATE']
          if not re.fullmatch('[0-9a-f]{40}',candidate): raise SystemExit('Invalid source revision')
          api_root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def api(path,payload):
              # This review operation creates objects only. It never updates a ref or branch.
              if path not in ('/git/blobs','/git/trees','/git/commits'): raise ValueError('Unsupported operation')
              req=urllib.request.Request(api_root+path,data=json.dumps(payload).encode(),headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=45) as response: return json.load(response)
          allowed={'player-bodies.png','animation-field_rat.png','animation-wild_hare.png',
              'animation-polar_bear.png','animation-sea_turtle.png','normal-mobs.png','item-icons.png',
              'npc-roles.png','building-starter_building_0.png','building-starter_building_1.png',
              '01-village-1280.png','01-village-1920.png','ui-inventory-1280.png','ui-character-1280.png',
              'ui-skills-1280.png','ui-abilities-1280.png','ui-map-1280.png',
              'equipment-state-0-frame-0.png','equipment-state-1-frame-4.png',
              'equipment-state-2-frame-4.png','equipment-state-3-frame-4.png','equipment-state-5-frame-7.png'}
          entries=[]; manifest=[]
          for path in sorted(root.rglob('*.png')):
              relative=path.relative_to(root)
              if len(relative.parts)!=2 or relative.parts[0] not in {'before','after','engine'} or path.name not in allowed: continue
              raw=path.read_bytes()
              if len(raw)>5_000_000 or not raw.startswith(b'\x89PNG\r\n\x1a\n'): raise ValueError('Invalid preview PNG')
              sha=api('/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']
              entries.append({'path':'review/'+relative.as_posix(),'mode':'100644','type':'blob','sha':sha})
              manifest.append({'file':relative.as_posix(),'sha256':hashlib.sha256(raw).hexdigest()})
          if not entries:
              print('NO_PREVIEWS: candidate failed before image generation; inspect diagnostics.')
              raise SystemExit(0)
          report=json.dumps({'source_revision':candidate,'source_sheets':'before/after','native_fixture_renders':'engine',
              'human_playtest':False,'visual_approval':'not_reviewed','files':manifest},indent=2)+'\n'
          entries.append({'path':'review/manifest.json','mode':'100644','type':'blob','content':report})
          tree=api('/git/trees',{'tree':entries})['sha']
          commit=api('/git/commits',{'message':'Visual review evidence for '+candidate,'tree':tree,'parents':[]})['sha']
          print('VISUAL_PREVIEW_COMMIT='+commit)
          for record in manifest: print('PREVIEW review/'+record['file'])
          print('Preview objects do not update main or approve visual quality.')
          PY
