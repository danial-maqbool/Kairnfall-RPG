name: Compile Windows client source
on:
  push:
    paths:
      - 'client/**'
      - 'src/**'
      - '.github/workflows/client.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile the Godot C# client and shared protocol
        run: dotnet build client/Kairnfall.Client.csproj -c Debug
      - name: Preserve compilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-source-${{ github.sha }}
          path: |
            client/**/*.cs
            client/*.csproj
            client/*.tscn
            client/*.godot
            client/*.cfg
          retention-days: 7
