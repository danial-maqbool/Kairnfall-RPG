name: Compile Windows client source
on:
  push:
    paths:
      - 'client/**'
      - 'src/**'
      - 'content/**'
      - 'content_src/**'
      - 'tools/build_content.py'
      - 'tools/build_game_assets.py'
      - 'tools/get_godot.py'
      - '.github/workflows/client.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the Godot C# client and shared protocol
        run: dotnet build client/Kairnfall.Client.csproj -c Debug
      - name: Build deterministic native test content pack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow==12.0.0
          python tools/build_content.py
          python tools/build_game_assets.py
      - name: Install verified Godot editor
        run: python tools/get_godot.py --os linux
      - name: Run native compact item card layout contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 "$GODOT_BIN" --headless --editor --path client --import
          timeout 180 "$GODOT_BIN" --headless --path client res://Tests/CompactItemCardContract.tscn
      - name: Preserve compilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-source-${{ github.sha }}
          path: |
            client/**/*.cs
            client/*.csproj
            client/*.tscn
            client/*.godot
            client/*.cfg
          retention-days: 7
