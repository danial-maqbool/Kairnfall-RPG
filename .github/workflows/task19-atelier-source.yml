name: Temporary Task 19 Atelier source generation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task19-atelier-source.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2abacf5c263d9ac6e38d938c392d6007217757b1
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and verify Task 19 source art
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow==12.0.0
          python tools/build_content.py
          python atelier/build.py --only items --jobs 1
          python -m unittest tests.handoff.test_equipment_progression tests.handoff.test_atelier_integration -v
          git status --short
      - name: Publish generated bytes as detached candidate commit
        shell: bash
        env:
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path

          base='2abacf5c263d9ac6e38d938c392d6007217757b1'
          expected={
              'atelier/Assets/manifest.json','atelier/coverage.json',
              'atelier/Assets/items/frostsilver_bar.png','atelier/Assets/items/frostsilver_ore.png','atelier/Assets/items/frostsilver_pickaxe.png',
              'atelier/Assets/items/ghost_reed.png','atelier/Assets/items/ghost_reed_extract.png','atelier/Assets/items/ghost_reed_sickle.png',
              'atelier/Assets/items/heartwood_burl.png','atelier/Assets/items/heartwood_forester_axe.png',
              'atelier/Assets/items/moonfin.png','atelier/Assets/items/moonfin_oil.png','atelier/Assets/items/moonfin_rod.png',
              'atelier/Assets/items/seasoned_heartwood.png',
          }
          actual={line[3:] for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines() if line.strip()}
          if actual!=expected:
              raise SystemExit('Unexpected generated diff: '+json.dumps({'missing':sorted(expected-actual),'extra':sorted(actual-expected)}))

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['API_TOKEN']
          def api(path, method='GET', payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=data,method=method,headers={
                  'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,
                  'X-GitHub-Api-Version':'2022-11-28','User-Agent':'kairnfall-task19-candidate'})
              with urllib.request.urlopen(req) as response: return json.load(response)

          base_tree=api('/git/commits/'+base)['tree']['sha']
          entries=[]
          for path in sorted(expected):
              raw=Path(path).read_bytes()
              blob=api('/git/blobs','POST',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api('/git/trees','POST',{'base_tree':base_tree,'tree':entries})
          commit=api('/git/commits','POST',{'message':'Task 19: add regional profession Atelier source art','tree':tree['sha'],'parents':[base]})
          Path('task19-candidate-sha.txt').write_text(commit['sha']+'\n')
          print('TASK19_GENERATED_CANDIDATE='+commit['sha'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: task19-generated-candidate
          retention-days: 1
          path: task19-candidate-sha.txt
