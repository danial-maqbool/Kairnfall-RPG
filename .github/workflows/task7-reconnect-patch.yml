name: Temporary Task 7 reconnect patch
on:
  push:
    paths:
      - '.github/workflows/task7-reconnect-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reset connection-bound state on restart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/Kairnfall.Server/RealmHost.cs')
          text=path.read_text()
          old='        engine.State.Trades.Clear();\n        PersistenceIntegrity.RequireValid(engine);'
          new='        engine.ResetTransientConnectionState();\n        PersistenceIntegrity.RequireValid(engine);'
          if old not in text:
              raise SystemExit('Expected Task 7 startup block not found')
          path.write_text(text.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Kairnfall.Server/RealmHost.cs
          git commit -m "fix: reset stale connection state after restart"
          git push origin HEAD:main
