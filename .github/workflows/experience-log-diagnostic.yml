name: Read bounded experience test diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/experience-log-diagnostic.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the recorded integrated-source test artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: danial-maqbool/Kairnfall-RPG
          run-id: 34324914335
          artifact-ids: '10093744863'
          path: evidence
      - name: Inspect native startup and last completed stages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('evidence')
          revisions = list(root.rglob('revision.txt'))
          expected = '51b575323969da9c9b0fab5f3c23a7a5f0c4147e'
          if len(revisions) != 1 or revisions[0].read_text().strip() != expected:
              raise SystemExit('The artifact does not match the reviewed source')
          print('SOURCE=' + expected)
          for path in sorted(root.rglob('*.log')):
              if path.is_symlink():
                  raise SystemExit('Refuse a symbolic log path')
              print('LOG', path.relative_to(root).as_posix(), path.stat().st_size)
          for suffix in ('control-rules.log', 'controls-progress.log'):
              paths = list(root.rglob(suffix))
              print('\n=== ' + suffix + ' ===')
              if not paths:
                  print('NOT PRODUCED')
              for path in paths:
                  lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
                  print('LINES=' + str(len(lines)))
                  print('FIRST LINES\n' + '\n'.join(lines[:35])[:16000])
                  print('LAST LINES\n' + '\n'.join(lines[-120:])[-26000:])
          print('Diagnostic inspection does not run, skip, approve, or modify any test.')
          PY
