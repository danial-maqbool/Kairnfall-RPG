name: Read bounded experience test diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/experience-log-diagnostic.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the recorded candidate test artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: danial-maqbool/Kairnfall-RPG
          run-id: 34184723299
          artifact-ids: '10040210436'
          path: evidence
      - name: Print bounded combat evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('evidence')
          for suffix in ('revision.txt', 'live-experience.log'):
              paths = list(root.rglob(suffix))
              print('\n=== ' + suffix + ' ===')
              if not paths:
                  raise SystemExit('Required diagnostic file was not produced')
              for path in paths:
                  lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
                  selected = [line for line in lines if suffix == 'revision.txt' or any(key in line for key in ('COMBAT_TRACE', 'ERROR:', 'TimeoutException', 'PASS LIVE EXPERIENCE:', 'LIVE_EXPERIENCE_CONTRACT:'))]
                  print('\n'.join(selected[-90:])[-20000:])
          PY
