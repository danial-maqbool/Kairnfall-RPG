name: Art library source and visual verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/art-library-review.yml', 'atelier/**', 'foundry/**']
permissions:
  contents: read
concurrency:
  group: art-library-main-verification
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Verify joins, panels, terrain, manifests, atlases and repeat bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/art-library-review
          git rev-parse HEAD > artifacts/art-library-review/revision.txt
          python foundry/verify_repairs.py --report artifacts/art-library-review/result.json 2>&1 | tee artifacts/art-library-review/verification.log
          git diff --check
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          changed = [p for p in subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0') if p]
          allowed = {'atelier/coverage.json','foundry/coverage.json'}
          unexpected = sorted(set(changed) - allowed)
          if unexpected: raise SystemExit('Committed files differ from rebuild: '+', '.join(unexpected))
          for path in changed:
              original = json.loads(subprocess.check_output(['git','show','HEAD:'+path]))
              rebuilt = json.loads(Path(path).read_text())
              original.pop('built_seconds',None); rebuilt.pop('built_seconds',None)
              if original != rebuilt: raise SystemExit('Coverage drift: '+path)
          untracked = [p for p in subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z','--','atelier','foundry']).decode().split('\0') if p]
          if untracked: raise SystemExit('Generated files were not committed: '+', '.join(untracked))
          print('Committed library source and generated output match the repeat build.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-library-verified-${{ github.sha }}
          path: |
            artifacts/art-library-review/
            foundry/preview/ground.png
            foundry/preview/scene.png
            foundry/preview/ui.png
            foundry/preview/cliffs.png
            foundry/preview/panels.png
            foundry/preview/terrain.png
          if-no-files-found: error
          retention-days: 14
