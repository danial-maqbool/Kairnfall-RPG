name: Task 22 temporary branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/task22-branch-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove accidental temporary refs
        run: |
          git push origin --delete __invalid_no_branch_should_not_create__ || true
          git push origin --delete __temp_cleanup_probe__ || true
      - name: Remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/task22-branch-cleanup.yml
          git commit -m 'Clean temporary Task 22 branch cleanup workflow'
          git push origin HEAD:main
