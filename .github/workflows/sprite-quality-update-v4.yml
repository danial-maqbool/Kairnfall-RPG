name: Verify and publish tooltip and sprite refinement v4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sprite-quality-update-v4.yml']
permissions:
  contents: write
concurrency:
  group: sprite-quality-update-v4
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned environment and exact before review sheets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow==12.0.0
          python tools/build_content.py > /tmp/content.log
          mkdir -p artifacts/sprite-quality/{before,after,engine,logs}
          git rev-parse HEAD > artifacts/sprite-quality/base-revision.txt
          python --version | tee artifacts/sprite-quality/logs/python.log
          python - <<'PY' | tee artifacts/sprite-quality/logs/pillow.log
          import PIL
          print('Pillow', PIL.__version__)
          PY
          for sheet in body beasts items gear scene; do
            python atelier/preview.py "$sheet" --out "artifacts/sprite-quality/before/$sheet.png"
          done
      - name: Reconstruct exact reviewed patch from ordered text objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          base='c3003a477a25c50d646299c2fcd59fce704cb136'
          chunks=[
            '0ba9e986cd5942be38c72bd7b4c85bf96266ae1c',
            '6f87b28ed7e6c0b035a7314aeecda270095a0591',
            'ceb3771df7753becb9ef7848295eb9b9633e641e',
            '53e288c17aca2273de79d97942e57f46314f1b5a',
            '100d019092a07dece4c8329e46f9afd87510a783',
            '86cd76b0e1bfd1725f41b275f82c29833e728e77',
            'b19419d0285c4a69f2377a712a611b77d8de2b2d',
            '478a5b5d1ddcfae7e31e3b9ca8d543eb4cdee085',
            '4764450d7b82a9b8ec63264d4a06f9a17dc8af7f',
            'bb1472b73daf1cd1d0301e10b5c2c8745fbb6c68',
            'b3313837634452a0a3468e89a218099968910960',
            '445bdd1f6fb54ed3c6a74d545dd26b463881335e',
            'e742a100a11cce4bb5582ee5935f199288674956',
            '9db5ba4e8e5321345660e32a5b35dd53626fd981',
            'fa48b836427797787f6c1a01924b5dfe03419e3c',
            '90b42657351fa5ef52c575577676ba82ed4eb6a4',
            'e5ae595d7a969c863ee1c993f86dc0c109d7e3fe',
            '188a1479619bcb1bfb459cb0e2ad5cf7d3f2491c',
          ]
          expected='e28b3c6a1fd53318f94fd5ff4af610c1d742b6254109019d87cdce130cddad16'
          allowed={
            'client/Scripts/CompactItemCard.cs','client/Tests/ItemCommerceUiChecks.cs',
            'atelier/forge/brush.py','atelier/forge/folk.py','atelier/forge/beasts.py',
            'atelier/forge/smith.py','atelier/tests/test_sprite_refinement.py'
          }
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          encoded=[]
          for sha in chunks:
            url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}"
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=45) as response: record=json.load(response)
            raw=base64.b64decode(record['content'])
            actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            if actual!=sha: raise SystemExit('Chunk integrity failed: '+sha)
            encoded.append(raw.decode('ascii'))
          encoded_text=''.join(encoded)
          if len(encoded_text)!=33012: raise SystemExit(f'Encoded patch length mismatch: {len(encoded_text)}')
          patch=base64.b64decode(encoded_text,validate=True)
          if hashlib.sha256(patch).hexdigest()!=expected: raise SystemExit('Reviewed patch SHA-256 mismatch')
          target=Path('artifacts/sprite-quality/refinement.patch'); target.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          if changed!=allowed: raise SystemExit('Unexpected patch paths: '+repr(sorted(changed)))
          print('PATCH VERIFIED:', expected, 'paths:', len(changed))
      - name: Run focused sprite and tooltip tests and render after sheets
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest atelier.tests.test_sprite_refinement -v 2>&1 | tee artifacts/sprite-quality/logs/refinement-tests.log
          for sheet in body beasts items gear scene; do
            python atelier/preview.py "$sheet" --out "artifacts/sprite-quality/after/$sheet.png"
          done
      - name: Rebuild committed libraries twice and prove determinism
        shell: bash
        run: |
          set -euo pipefail
          rebuild() {
            python atelier/build.py --only items people equipment npcs mobs gear gear_worn --jobs 8
            python atelier/build.py --manifest
            python foundry/build.py --pack-atelier --atlas
          }
          rebuild 2>&1 | tee artifacts/sprite-quality/logs/art-build-first.log
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def snapshot():
              values={}
              for root in [Path('atelier/Assets'),Path('foundry/Assets/atlas_atelier')]:
                  for p in sorted(x for x in root.rglob('*') if x.is_file()):
                      values[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
              p=Path('atelier/gear.json'); values[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
              c=json.loads(Path('atelier/coverage.json').read_text()); c.pop('built_seconds',None)
              values['atelier/coverage.json#normalized']=hashlib.sha256(json.dumps(c,sort_keys=True).encode()).hexdigest()
              return values
          values=snapshot(); Path('artifacts/sprite-quality/first-hashes.json').write_text(json.dumps(values,sort_keys=True,indent=2)+'\n')
          print('First snapshot:',len(values),'records')
          PY
          rebuild 2>&1 | tee artifacts/sprite-quality/logs/art-build-second.log
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected=json.loads(Path('artifacts/sprite-quality/first-hashes.json').read_text()); actual={}
          for root in [Path('atelier/Assets'),Path('foundry/Assets/atlas_atelier')]:
              for p in sorted(x for x in root.rglob('*') if x.is_file()): actual[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          p=Path('atelier/gear.json'); actual[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          c=json.loads(Path('atelier/coverage.json').read_text()); c.pop('built_seconds',None)
          actual['atelier/coverage.json#normalized']=hashlib.sha256(json.dumps(c,sort_keys=True).encode()).hexdigest()
          if expected!=actual:
              bad=sorted(k for k in set(expected)|set(actual) if expected.get(k)!=actual.get(k)); raise SystemExit('Non-deterministic output: '+', '.join(bad[:40]))
          print('DETERMINISM PASS:',len(actual),'records; only coverage built_seconds excluded')
          PY
      - name: Compile client and validate integrated art
        shell: bash
        run: |
          set -euo pipefail
          dotnet build client/Kairnfall.Client.csproj -c Debug 2>&1 | tee artifacts/sprite-quality/logs/client-build.log
          python tools/build_game_assets.py 2>&1 | tee artifacts/sprite-quality/logs/game-assets.log
          python tools/complete_skill_icons.py 2>&1 | tee artifacts/sprite-quality/logs/skill-icons.log
          python tools/validate_game_assets.py 2>&1 | tee artifacts/sprite-quality/logs/game-assets-validation.log
          python tools/get_godot.py --os linux 2>&1 | tee artifacts/sprite-quality/logs/godot.log
      - name: Native compact tooltip and graphical presentation checks
        env:
          KAIRNFALL_SCREENSHOTS: ${{ github.workspace }}/artifacts/sprite-quality/engine
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 "$GODOT_BIN" --headless --editor --path client --import 2>&1 | tee artifacts/sprite-quality/logs/import.log
          timeout 180 "$GODOT_BIN" --verbose --headless --path client res://Tests/ControlRulesContract.tscn 2>&1 | tee artifacts/sprite-quality/logs/control-rules.log
          timeout 240 xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_BIN" --path client --rendering-method gl_compatibility --audio-driver Dummy res://Tests/VisualPresentationContract.tscn 2>&1 | tee artifacts/sprite-quality/logs/native-visual.log
          for log in import control-rules native-visual; do
            if grep -E '(^|[[:space:]])(ERROR:|SCRIPT ERROR:|Unhandled exception)' "artifacts/sprite-quality/logs/$log.log"; then exit 1; fi
          done
          test -s artifacts/sprite-quality/engine/item-compare-1280.png
          test -s artifacts/sprite-quality/engine/ui-inventory-1280.png
          test -s artifacts/sprite-quality/engine/01-village-1280.png
      - name: Stage only requested source and generated art libraries
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet HEAD -- client/Assets tools/art content_src content
          git add -- client/Scripts/CompactItemCard.cs client/Tests/ItemCommerceUiChecks.cs \
            atelier/forge/brush.py atelier/forge/folk.py atelier/forge/beasts.py atelier/forge/smith.py \
            atelier/tests/test_sprite_refinement.py atelier/Assets atelier/coverage.json atelier/gear.json \
            foundry/Assets/atlas_atelier
          git diff --cached --check
          git diff --cached --name-only | tee artifacts/sprite-quality/published-files.txt
          python - <<'PY'
          from pathlib import Path
          paths=Path('artifacts/sprite-quality/published-files.txt').read_text().splitlines()
          prefixes=('client/Scripts/CompactItemCard.cs','client/Tests/ItemCommerceUiChecks.cs','atelier/','foundry/Assets/atlas_atelier/')
          bad=[p for p in paths if not p.startswith(prefixes)]
          if not paths or bad: raise SystemExit('Unexpected publish scope: '+repr(bad))
          print('Publish scope:',len(paths),'files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sprite-quality-review-${{ github.sha }}
          path: artifacts/sprite-quality/
          if-no-files-found: error
          retention-days: 14
      - name: Commit and push main only after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Danial Maqbool'
          git config user.email 'danial.maqbool48@gmail.com'
          git commit -m 'refactor(art): compact item hover cards and refine sprite pixel detail' -m 'Match the compact hover-card footprint from the player screenshot while preserving full inventory details. Keep 64px actors, 128px bosses and 32px icons at the established world scale while adding a second modelling pass, garment construction cues, species surface detail, eye glints and material micro-detail.' -m 'Co-Authored-By: GPT 6 Pro <noreply@openai.com>'
          git push origin HEAD:main
