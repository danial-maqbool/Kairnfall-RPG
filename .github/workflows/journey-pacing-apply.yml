name: Verify and apply journey pacing

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/journey-pacing-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply focused source patch
        run: python3 tools/apply_journey_pacing_update.py
      - name: Verify content, server, journey rules, and client compile
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_content.py
          dotnet build Kairnfall.slnx -c Release
          dotnet run --no-build --project tools/world_probe/world_probe.csproj -c Release
          dotnet build client/Kairnfall.Client.csproj -c Debug
          git diff --check
      - name: Publish verified update and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/journey-pacing-apply.yml tools/apply_journey_pacing_update.py
          git add src/Kairnfall.Core/Mechanics.cs src/Kairnfall.Core/RealmEconomy.cs client/Scripts/Maps.cs client/Scripts/HuntingGuidePanel.cs client/Scripts/GameRoot.Hud.cs tools/world_probe/JourneyPacingChecks.cs tools/world_probe/Program.cs content/catalog.json client/Data/catalog.json
          git commit -m 'feat: add guided level-gated journey progression'
          git pull --rebase origin main
          git push origin HEAD:main
