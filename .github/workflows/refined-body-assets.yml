name: Refined humanoid base asset sync

on:
  push:
    branches: [main]
    paths:
      - 'atelier/forge/refined_body.py'
      - 'atelier/forge/__init__.py'
      - '.github/workflows/refined-body-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refined-humanoid-base-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install art dependency
        run: python -m pip install Pillow==12.0.0
      - name: Regenerate people assets and manifest
        run: python atelier/build.py --only people --jobs 1
      - name: Verify refined body contract
        run: python -m unittest atelier.tests.test_refined_body_batch01 -v
      - name: Validate generated base sheets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          root = Path('atelier/Assets/people')
          files = sorted(root.glob('body_*.png'))
          if len(files) != 12:
              raise SystemExit(f'Expected 12 base body sheets, found {len(files)}')
          for path in files:
              with Image.open(path) as image:
                  if image.mode != 'RGBA' or image.size != (512, 1536):
                      raise SystemExit(f'Bad sheet contract: {path} {image.mode} {image.size}')
                  hashes = set()
                  for row in range(24):
                      for column in range(8):
                          frame = image.crop((column * 64, row * 64, (column + 1) * 64, (row + 1) * 64))
                          if frame.getchannel('A').getbbox() is None:
                              raise SystemExit(f'Blank frame: {path} row={row} col={column}')
                          hashes.add(hashlib.sha256(frame.tobytes()).digest())
                  if len(hashes) <= 80:
                      raise SystemExit(f'Insufficient animation variation: {path} {len(hashes)}')
          print('Validated 12 refined humanoid base sheets.')
          PY
          git diff --check
      - name: Commit generated batch to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atelier/Assets/people/body_*.png atelier/Assets/manifest.json atelier/coverage.json atelier/Assets/CREDITS.txt atelier/gear.json
          if git diff --cached --quiet; then
            echo 'Generated assets already match the renderer.'
            exit 0
          fi
          git commit -m 'art: regenerate refined humanoid base sprites'
          git pull --rebase origin main
          git push origin HEAD:main
