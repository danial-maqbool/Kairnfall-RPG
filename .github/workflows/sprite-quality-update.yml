name: Verify and publish compact tooltip and sprite refinement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sprite-quality-update.yml']
permissions:
  contents: write
concurrency:
  group: sprite-quality-update
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned art dependency and build catalog
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow==12.0.0
          python tools/build_content.py > /tmp/content.log
          mkdir -p artifacts/sprite-quality/{before,after,engine,logs}
          git rev-parse HEAD > artifacts/sprite-quality/base-revision.txt
          python --version | tee artifacts/sprite-quality/logs/python.log
          python - <<'PY' | tee artifacts/sprite-quality/logs/pillow.log
          import PIL
          print('Pillow', PIL.__version__)
          PY
      - name: Render exact before sheets
        shell: bash
        run: |
          set -euo pipefail
          for sheet in body beasts items gear scene; do
            python atelier/preview.py "$sheet" --out "artifacts/sprite-quality/before/$sheet.png"
          done
      - name: Apply reviewed source patch with integrity checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          expected_base='c3003a477a25c50d646299c2fcd59fce704cb136'
          blob_sha='31f8633654bd3e76d5c5997475526b4b1384d100'
          gzip_sha='7db20841203977e0d468d98b40f5b021c7691c747693882aa23315a98d0ba4c6'
          patch_sha='70a8155055f29cf0d0e530885091d38db776cacad8c45039805dab9f81662866'
          allowed={
              'client/Scripts/CompactItemCard.cs',
              'client/Tests/ItemCommerceUiChecks.cs',
              'atelier/forge/brush.py',
              'atelier/forge/folk.py',
              'atelier/forge/beasts.py',
              'atelier/forge/smith.py',
              'atelier/tests/test_sprite_refinement.py',
          }
          subprocess.run(['git','merge-base','--is-ancestor',expected_base,'HEAD'],check=True)
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{blob_sha}"
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=45) as response: record=json.load(response)
          raw=base64.b64decode(record['content'])
          if hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()!=blob_sha: raise SystemExit('Git blob integrity failed')
          if hashlib.sha256(raw).hexdigest()!=gzip_sha: raise SystemExit('Compressed patch digest failed')
          patch=gzip.decompress(raw)
          if hashlib.sha256(patch).hexdigest()!=patch_sha: raise SystemExit('Patch digest failed')
          path=Path('artifacts/sprite-quality/refinement.patch'); path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          if changed!=allowed:
              raise SystemExit('Patch path mismatch: '+repr(sorted(changed)))
          print('Applied exactly',len(changed),'reviewed source/test files.')
      - name: Run focused refinement tests and render after sheets
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest atelier.tests.test_sprite_refinement -v 2>&1 | tee artifacts/sprite-quality/logs/refinement-tests.log
          for sheet in body beasts items gear scene; do
            python atelier/preview.py "$sheet" --out "artifacts/sprite-quality/after/$sheet.png"
          done
      - name: Rebuild affected committed libraries twice and prove determinism
        shell: bash
        run: |
          set -euo pipefail
          rebuild() {
            python atelier/build.py --only items people equipment npcs mobs gear gear_worn --jobs 8
            python atelier/build.py --manifest
            python foundry/build.py --pack-atelier --atlas
          }
          rebuild 2>&1 | tee artifacts/sprite-quality/logs/art-build-first.log
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          roots=[Path('atelier/Assets'),Path('foundry/Assets/atlas_atelier')]
          extra=[Path('atelier/gear.json')]
          values={}
          for root in roots:
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  values[path.as_posix()]=hashlib.sha256(path.read_bytes()).hexdigest()
          for path in extra:
              values[path.as_posix()]=hashlib.sha256(path.read_bytes()).hexdigest()
          coverage=json.loads(Path('atelier/coverage.json').read_text()); coverage.pop('built_seconds',None)
          values['atelier/coverage.json#normalized']=hashlib.sha256(json.dumps(coverage,sort_keys=True).encode()).hexdigest()
          Path('artifacts/sprite-quality/first-hashes.json').write_text(json.dumps(values,sort_keys=True,indent=2)+'\n')
          print('First snapshot:',len(values),'files/records')
          PY
          rebuild 2>&1 | tee artifacts/sprite-quality/logs/art-build-second.log
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected=json.loads(Path('artifacts/sprite-quality/first-hashes.json').read_text())
          actual={}
          for root in [Path('atelier/Assets'),Path('foundry/Assets/atlas_atelier')]:
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  actual[path.as_posix()]=hashlib.sha256(path.read_bytes()).hexdigest()
          path=Path('atelier/gear.json'); actual[path.as_posix()]=hashlib.sha256(path.read_bytes()).hexdigest()
          coverage=json.loads(Path('atelier/coverage.json').read_text()); coverage.pop('built_seconds',None)
          actual['atelier/coverage.json#normalized']=hashlib.sha256(json.dumps(coverage,sort_keys=True).encode()).hexdigest()
          if expected!=actual:
              bad=sorted(k for k in set(expected)|set(actual) if expected.get(k)!=actual.get(k))
              raise SystemExit('Non-deterministic library output: '+', '.join(bad[:30]))
          print('DETERMINISM PASS:',len(actual),'files/records; only raw built_seconds excluded.')
          PY
      - name: Compile client and reconstruct integrated game art
        shell: bash
        run: |
          set -euo pipefail
          dotnet build client/Kairnfall.Client.csproj -c Debug 2>&1 | tee artifacts/sprite-quality/logs/client-build.log
          python tools/build_game_assets.py 2>&1 | tee artifacts/sprite-quality/logs/game-assets.log
          python tools/complete_skill_icons.py 2>&1 | tee artifacts/sprite-quality/logs/skill-icons.log
          python tools/validate_game_assets.py 2>&1 | tee artifacts/sprite-quality/logs/game-assets-validation.log
          python tools/get_godot.py --os linux 2>&1 | tee artifacts/sprite-quality/logs/godot.log
      - name: Run native tooltip, control and graphical presentation checks
        env:
          KAIRNFALL_SCREENSHOTS: ${{ github.workspace }}/artifacts/sprite-quality/engine
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 "$GODOT_BIN" --headless --editor --path client --import 2>&1 | tee artifacts/sprite-quality/logs/import.log
          timeout 180 "$GODOT_BIN" --verbose --headless --path client res://Tests/ControlRulesContract.tscn 2>&1 | tee artifacts/sprite-quality/logs/control-rules.log
          timeout 240 xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_BIN" --path client --rendering-method gl_compatibility --audio-driver Dummy res://Tests/VisualPresentationContract.tscn 2>&1 | tee artifacts/sprite-quality/logs/native-visual.log
          for log in import control-rules native-visual; do
            if grep -E '(^|[[:space:]])(ERROR:|SCRIPT ERROR:|Unhandled exception)' "artifacts/sprite-quality/logs/$log.log"; then exit 1; fi
          done
          test -s artifacts/sprite-quality/engine/item-compare-1280.png
          test -s artifacts/sprite-quality/engine/ui-inventory-1280.png
          test -s artifacts/sprite-quality/engine/01-village-1280.png
      - name: Verify protected paths and staged library scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet HEAD -- client/Assets tools/art content_src content
          git add -- client/Scripts/CompactItemCard.cs client/Tests/ItemCommerceUiChecks.cs \
            atelier/forge/brush.py atelier/forge/folk.py atelier/forge/beasts.py atelier/forge/smith.py \
            atelier/tests/test_sprite_refinement.py atelier/Assets atelier/coverage.json atelier/gear.json \
            foundry/Assets/atlas_atelier
          git diff --cached --check
          git diff --cached --name-only > artifacts/sprite-quality/published-files.txt
          python - <<'PY'
          from pathlib import Path
          paths=Path('artifacts/sprite-quality/published-files.txt').read_text().splitlines()
          if not paths: raise SystemExit('No source/generated changes staged')
          allowed=('client/Scripts/CompactItemCard.cs','client/Tests/ItemCommerceUiChecks.cs','atelier/','foundry/Assets/atlas_atelier/')
          bad=[p for p in paths if not p.startswith(allowed)]
          if bad: raise SystemExit('Unexpected staged paths: '+', '.join(bad))
          print('Publish scope:',len(paths),'files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sprite-quality-review-${{ github.sha }}
          path: artifacts/sprite-quality/
          if-no-files-found: error
          retention-days: 14
      - name: Commit and push the fully tested update to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Danial Maqbool'
          git config user.email 'danial.maqbool48@gmail.com'
          git commit -m 'refactor(art): compact item hover cards and refine sprite pixel detail' -m 'Keep the 64px actor, 128px boss and 32px icon contracts while adding a second modelling pass, garment construction detail, species surface cues and material micro-detail. Rebuild and commit the Atelier outputs and packed Foundry atlas after deterministic and native Godot review.' -m 'Co-Authored-By: GPT 6 Pro <noreply@openai.com>'
          git push origin HEAD:main
