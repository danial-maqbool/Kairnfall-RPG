name: Character rebuild staging
on:
  push:
    branches: [main]
    paths:
      - 'tools/art/character_motion.py'
      - 'tools/art/characters.py'
      - 'tools/character_rebuild_stage.py'
      - '.github/workflows/character-rebuild-stage.yml'
permissions:
  contents: write
concurrency:
  group: character-rebuild-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construct and inspect inactive replacement frames
        run: |
          set -euo pipefail
          python -m pip install Pillow==12.0.0
          python tools/build_content.py
          python tools/character_rebuild_stage.py
      - name: Retain renderer review and explicit failure report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/art/character-rebuild/stage-report.json || exit 0
          current=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)
          test "$current" = "$GITHUB_SHA" || { echo 'main moved; refusing to publish stale preview'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/art/character-rebuild/heroes.png docs/art/character-rebuild/motion.png docs/art/character-rebuild/stage-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'test(art): retain replacement character frames and staging results'
          gh auth setup-git
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-rebuild-stage-${{ github.sha }}
          path: docs/art/character-rebuild/
          retention-days: 7
          if-no-files-found: error
