name: Repair Atelier keepsake coverage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-keepsake-art.yml']
permissions:
  contents: write
concurrency:
  group: repair-atelier-keepsake-coverage
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: python -m pip install Pillow==12.0.0
      - name: Repair stale derived hero cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/integrate_atelier.py')
          text=path.read_text(encoding='utf-8')
          old="""def install_authored_hero(library:Path,output:Path)->None:\n    source=library.parent/'authored/player/hero.png'\n    if not source.is_file():return\n"""
          new="""def install_authored_hero(library:Path,output:Path)->None:\n    source=library.parent/'authored/player/hero.png'\n    target=safe_path(output,'people/hero')\n    if not source.is_file():\n        target.unlink(missing_ok=True)\n        return\n"""
          if text.count(old)!=1:
              raise SystemExit('Authored-hero cleanup anchor changed.')
          text=text.replace(old,new)
          old="    target=safe_path(output,'people/hero');target.parent.mkdir(parents=True,exist_ok=True)\n"
          new="    target.parent.mkdir(parents=True,exist_ok=True)\n"
          if text.count(old)!=1:
              raise SystemExit('Authored-hero target anchor changed.')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
      - name: Build catalog and render only missing regional keepsakes
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_content.py
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('atelier').resolve()))
          import build as atelier_build
          data=json.loads(Path('content/catalog.json').read_text(encoding='utf-8'))
          expected=sorted('items/'+item['id'] for item in data['items'] if item['id'].startswith('keepsake_'))
          tasks=[task for task in atelier_build.plan({'items'}) if task[1] in expected]
          actual=sorted(task[1] for task in tasks)
          if len(expected)!=20 or actual!=expected:
              raise SystemExit(f'Expected exactly 20 authored regional keepsakes; expected={len(expected)} rendered={len(actual)}')
          for task in tasks:
              atelier_build.render(task)
          print('Rendered authoritative Atelier keepsakes:',len(tasks))
          PY
          python atelier/build.py --manifest
      - name: Rebuild shipped assets and require complete item provenance
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_game_assets.py
          python - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path('content/catalog.json').read_text(encoding='utf-8'))
          audit=json.loads(Path('client/Assets/atelier-integration.json').read_text(encoding='utf-8'))
          keepsakes=sorted(item['id'] for item in catalog['items'] if item['id'].startswith('keepsake_'))
          if len(keepsakes)!=20:
              raise SystemExit('Unexpected regional keepsake count: '+str(len(keepsakes)))
          if audit['groups'].get('items')!=len(catalog['items']):
              raise SystemExit(f"Atelier item coverage is incomplete: {audit['groups'].get('items')}/{len(catalog['items'])}")
          skipped_items=[entry['key'] for entry in audit.get('skipped',[]) if entry['key'].startswith('items/')]
          if skipped_items:
              raise SystemExit('Catalog item fallbacks remain: '+', '.join(skipped_items))
          for item in keepsakes:
              if not Path('atelier/Assets/items',item+'.png').is_file():
                  raise SystemExit('Missing authoritative keepsake: '+item)
              if not Path('client/Assets/items',item+'.png').is_file():
                  raise SystemExit('Missing shipped keepsake: '+item)
          if Path('client/Assets/people/hero.png').exists():
              raise SystemExit('Stale derived hero sheet survived integration cleanup.')
          print('Atelier item coverage:',audit['groups']['items'],'/',len(catalog['items']))
          PY
          dotnet build client/Kairnfall.Client.csproj -c Release
          git diff --check
      - name: Publish verified repair and remove publisher
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-keepsake-art.yml
          git add -A
          python - <<'PY'
          import subprocess
          paths=[p for p in subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0') if p]
          exact={
              '.github/workflows/repair-keepsake-art.yml',
              'tools/integrate_atelier.py',
              'atelier/Assets/manifest.json',
              'atelier/coverage.json',
              'client/Assets/atelier-integration.json',
              'client/Assets/manifest.json',
              'client/Assets/people/hero.png',
          }
          def allowed(path):
              return path in exact or path.startswith('atelier/Assets/items/keepsake_') or path.startswith('client/Assets/items/keepsake_')
          unexpected=[p for p in paths if not allowed(p)]
          source=[p for p in paths if p.startswith('atelier/Assets/items/keepsake_')]
          shipped=[p for p in paths if p.startswith('client/Assets/items/keepsake_')]
          if unexpected:
              raise SystemExit('Unexpected generated changes: '+', '.join(unexpected))
          if len(source)!=20 or len(shipped)!=20:
              raise SystemExit(f'Expected 20 source and 20 shipped keepsake changes, found {len(source)} and {len(shipped)}')
          print('Publishing focused paths:',len(paths))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete Atelier keepsake asset coverage'
          git push origin HEAD:main
