name: Verify final terrain refinement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/art-refinement.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Apply only the reviewed terrain and seam-test changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          base = 'b0ee1d9eccf71d9423de1076ac546673170de1ef'
          allowed = ['atelier/forge/lands.py', 'foundry/tests/test_visual_repairs.py']
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          subprocess.run(['git','diff','--quiet',base,'HEAD','--',*allowed],check=True)
          out = Path('artifacts/refinement'); out.mkdir(parents=True,exist_ok=True)
          sha = '80448511865d3a9463384d5eb592608eb02ffe53'
          req = urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=45) as response: data=json.load(response)
          raw=base64.b64decode(data['content'])
          if hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()!=sha: raise ValueError('Blob integrity failed')
          patch=gzip.decompress(raw)
          if len(patch)>20000 or hashlib.sha256(patch).hexdigest()!='21ee964e4ea2112761cfff52dff3b02f252e4395c6c8e7d94f5ea85beae7de06': raise ValueError('Patch integrity failed')
          path=out/'refinement.patch'; path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          names=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          if sorted(names)!=sorted(allowed): raise ValueError('Unexpected patch paths')
      - name: Check both complete builds and all visual regressions
        shell: bash
        run: |
          set -euo pipefail
          python foundry/verify_repairs.py --report artifacts/refinement/result.json 2>&1 | tee artifacts/refinement/verification.log
          git diff --check
      - name: Retain verified generated files without updating a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, re, subprocess, time, urllib.error, urllib.request, zipfile
          from pathlib import Path
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def api(path,payload=None):
              if not re.fullmatch(r'/git/(blobs|trees|commits)(/[0-9a-f]{40})?',path): raise ValueError('Git objects only')
              data=None if payload is None else json.dumps(payload).encode()
              for attempt in range(4):
                  req=urllib.request.Request(root+path,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
                  try:
                      with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
                  except urllib.error.HTTPError as error:
                      message=error.read().decode('utf-8',errors='replace').lower()
                      limited=error.code==429 or error.code==403 and ('rate limit' in message or 'abuse' in message)
                      if (not limited and error.code not in (500,502,503,504)) or attempt==3: raise
                      time.sleep(max(60 if limited else 2**attempt,int(error.headers.get('Retry-After','0'))))
          subprocess.run(['git','add','--','atelier','foundry'],check=True)
          names=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          if not names or any(not name.startswith(('atelier/','foundry/')) for name in names): raise ValueError('Unexpected changed paths')
          out=Path('artifacts/refinement')
          with zipfile.ZipFile(out/'updates.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names: z.write(name,name)
          entries=[]
          for index,name in enumerate(names):
              path=Path(name)
              if path.is_symlink() or not path.is_file(): raise ValueError('Ordinary files only')
              raw=path.read_bytes()
              sha=api('/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']
              if sha!=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest(): raise ValueError('Uploaded blob mismatch')
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
              (out/'uploaded-blobs.json').write_text(json.dumps(entries))
              if index%20==0: print('Uploaded',index+1,'of',len(names),flush=True)
              time.sleep(1.1)
          parent=os.environ['GITHUB_SHA']; base_tree=api('/git/commits/'+parent)['tree']['sha']
          tree=api('/git/trees',{'base_tree':base_tree,'tree':entries})['sha']
          message='fix(art): refine natural-ground clusters and align sand variant seams\n\nPreserve connected cliffs and readable nine-slice panels. Include regenerated terrain, transitions, manifests, atlases and previews after repeat-build verification.\n\nCo-Authored-By: GPT 6 Pro <noreply@openai.com>'
          commit=api('/git/commits',{'message':message,'tree':tree,'parents':[parent]})['sha']
          (out/'candidate.json').write_text(json.dumps({'candidate':commit,'parent':parent,'tree':tree,'files':entries,'branch_updated':False},indent=2)+'\n')
          print('VERIFIED_REFINEMENT_CANDIDATE='+commit)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-refinement-${{ github.sha }}
          path: |
            artifacts/refinement/
            foundry/preview/*.png
          if-no-files-found: error
          retention-days: 14
