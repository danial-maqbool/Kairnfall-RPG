name: Finalize first-hour UI and cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grounded-motion-repair.yml'
permissions:
  contents: write
concurrency:
  group: first-hour-finalizer
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Wire real page profiles and broaden native UI matrices
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected patch anchor in {path}: {old[:80]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          ux='client/Scripts/GameRoot.UiUx.cs'
          replace_once(ux,
          '''        var desired = new Vector2(
                      Math.Max(320, Math.Min(1100, viewport.X - 80)),
                      Math.Max(300, Math.Min(670, viewport.Y - 140)));
                  gameWindow.Size = desired;''',
          '''        var profile = PageLayoutProfiles.For(currentPage);
                  var desired = PageLayoutProfiles.SizeFor(currentPage, viewport);
                  gameWindow.Size = desired;
                  gameWindow.TooltipText = profile.Summary;
                  gameWindow.SetMeta("page_layout_profile", currentPage);
                  gameWindow.SetMeta("page_layout_summary", profile.Summary);''')

          windows='client/Tests/WindowsScaleContract.cs'
          p=Path(windows); text=p.read_text(encoding='utf-8')
          old_sizes='foreach(var size in new[]{new Vector2I(1280,720),new Vector2I(1920,1080)})'
          if text.count(old_sizes) < 1:
              raise SystemExit('Windows scale matrix anchor missing')
          text=text.replace(old_sizes,'foreach(var size in new[]{new Vector2I(1280,720),new Vector2I(1920,1080),new Vector2I(2560,1440)})')
          anchor='''            Call(game,"OpenPage","Settings"); await Frame(); await Frame(); Call(game,"SynchronizeModalUx"); await Frame();\n'''
          if anchor not in text:
              raise SystemExit('Settings profile assertion anchor missing')
          text=text.replace(anchor,anchor+'''            var settingsProfile=global::PageLayoutProfiles.For("Settings");
                      Require(Field<PanelContainer>(game,"gameWindow").TooltipText==settingsProfile.Summary,"Settings uses the shared page-specific purpose summary");
                      Require(global::PageLayoutProfiles.SizeFor("Dialogue",new Vector2(1920,1080)).X<global::PageLayoutProfiles.SizeFor("Inventory",new Vector2(1920,1080)).X,"Content-specific profiles keep conversation more compact than inventory");
          ''',1)
          old_block='''            foreach(double textScale in new[]{.9d,1d,1.15d,1.25d})
                      {
                          Call(game,"ApplyUiTextScale",textScale,false);
                          foreach(string pageName in new[]{"Inventory","Bank","Character","Equipment Guide","Shop","Sell","Skills","Abilities","Quests","Dialogue","Crafting","Social","Trade","Auction","Map","Bestiary","Hunting","Achievements","Settings"})
                          {
                              Call(game,"OpenPage",pageName); await Frame(); await Frame(); Call(game,"FitOpenPage");
                              var window=Field<PanelContainer>(game,"gameWindow");
                              Require(Contained(window),pageName+" fits minimum Windows size at text scale "+textScale);
                              var closeButton=window.FindChildren("*","Button",true,false).OfType<Button>().First(button=>button.Text.StartsWith("Close",StringComparison.Ordinal));
                              Require(Contained(closeButton),pageName+" close remains reachable");
                              var overflow=window.FindChild("PageOverflow",true,false) as ScrollContainer;
                              Require(overflow is { FollowFocus:true },pageName+" overflow follows keyboard focus to offscreen content");
                              await Click(closeButton);
                              Require(Field<string>(game,"currentPage")=="",pageName+" closes via actual mouse input");
                          }
                      }
          '''
          new_block='''            foreach(var matrixSize in new[]{new Vector2I(1024,720),new Vector2I(1280,720),new Vector2I(1920,1080),new Vector2I(2560,1440)})
                      foreach(double textScale in new[]{.9d,1d,1.15d,1.25d})
                      {
                          GetWindow().ContentScaleFactor=1; GetWindow().Size=matrixSize; GetWindow().ContentScaleSize=matrixSize; await Frame(); await Frame();
                          Call(game,"ApplyUiTextScale",textScale,false);
                          string layoutLabel=$"{matrixSize.X}x{matrixSize.Y} at text scale {textScale:0.##}";
                          foreach(string pageName in new[]{"Inventory","Bank","Character","Equipment Guide","Shop","Sell","Skills","Abilities","Quests","Dialogue","Crafting","Social","Trade","Auction","Map","Bestiary","Hunting","Achievements","Settings"})
                          {
                              Call(game,"OpenPage",pageName); await Frame(); await Frame(); Call(game,"FitOpenPage");
                              var window=Field<PanelContainer>(game,"gameWindow");
                              Require(Contained(window),pageName+" fits "+layoutLabel);
                              Require(window.TooltipText==global::PageLayoutProfiles.For(pageName).Summary,pageName+" exposes its page-specific purpose summary at "+layoutLabel);
                              var closeButton=window.FindChildren("*","Button",true,false).OfType<Button>().First(button=>button.Text.StartsWith("Close",StringComparison.Ordinal));
                              Require(Contained(closeButton),pageName+" close remains reachable at "+layoutLabel);
                              var overflow=window.FindChild("PageOverflow",true,false) as ScrollContainer;
                              Require(overflow is { FollowFocus:true },pageName+" overflow follows keyboard focus at "+layoutLabel);
                              await Click(closeButton);
                              Require(Field<string>(game,"currentPage")=="",pageName+" closes via actual mouse input at "+layoutLabel);
                          }
                      }
          '''
          if old_block not in text:
              raise SystemExit('all-page layout matrix anchor missing')
          text=text.replace(old_block,new_block,1)
          text=text.replace('125%/150% Windows scale emulation. Physical Windows monitor DPI approval is not inferred.','1024/1280/1920/2560 layout and 125%/150% Windows scale emulation. Physical Windows monitor DPI approval is not inferred.')
          p.write_text(text,encoding='utf-8')

          visual='client/Tests/VisualPresentationContract.cs'
          p=Path(visual); text=p.read_text(encoding='utf-8')
          old='foreach(var size in new[]{new Vector2I(1280,720),new Vector2I(1920,1080)})'
          if text.count(old)<2:
              raise SystemExit('visual presentation size anchors missing')
          p.write_text(text.replace(old,'foreach(var size in new[]{new Vector2I(1280,720),new Vector2I(1920,1080),new Vector2I(2560,1440)})'),encoding='utf-8')

          ui_doc=Path('docs/UI_UX_ENGINEERING.md')
          text=ui_doc.read_text(encoding='utf-8')
          marker='## First-hour cohesive page-profile pass'
          if marker not in text:
              text += '''\n\n## First-hour cohesive page-profile pass\n\nThe shared `PageLayoutProfiles` table now drives the real modal window geometry rather\nthan remaining dead configuration. Each page publishes a concise purpose summary through\nthe native tooltip/accessibility surface while retaining Task 12 modal blocking, focus\nreturn, overflow scrolling, keyboard activation and error-prefix behavior.\n\nPermanent Windows coverage now exercises every existing page at 1024×720, 1280×720,\n1920×1080 and 2560×1440 across 90%, 100%, 115% and 125% UI text, plus 125%/150%\ncontent-scale emulation for HUD, Inventory, Crafting and Map. Rendered visual review also\nincludes 2560×1440. Physical monitor DPI and subjective usability remain human-only gates.\n'''
              ui_doc.write_text(text,encoding='utf-8')
          PY
      - name: Rebuild and validate deterministic assets and client source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==12.0.0
          python tools/build_content.py
          python tools/build_game_assets.py
          python tools/complete_skill_icons.py
          python tools/validate_game_assets.py
          python tools/validate_grounded_actor_assets.py
          dotnet build client/Kairnfall.Client.csproj -c Release
          git diff --check
      - name: Write migration manifest and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('content/catalog.json').read_text(encoding='utf-8'))
          integration=json.loads(Path('client/Assets/atelier-integration.json').read_text(encoding='utf-8'))
          bodies=2*6
          hairs=6*8
          equipment=sum(1 for item in data['items'] if item.get('slot'))
          roles=len({npc['role'] for npc in data['npcs']})
          mobs=len(data['mobs'])
          sheets=bodies+hairs+equipment+roles+mobs
          frames=sheets*6*4*8
          nonactor={k:v for k,v in integration.get('groups',{}).items() if k not in {'people','equipment','npcs','mobs'}}
          doc=f'''# First-hour art and UI migration manifest\n\nStatus date: 2026-09-16. This is repository-side migration evidence, not human artistic or usability approval.\n\n## Active actor migration\n\nGrounded-2026 is the sole active runtime source for player bodies/hair, equipment overlays, NPC roles and mobs. Historical Atelier actor bytes are fail-closed and actor fallback count is zero. The active grid is six real states (`idle`, `walk`, `attack`, `cast`, `hit`, `death`) × four directions × eight frames.\n\n| Family | Active sheets | Runtime policy |\n| --- | ---: | --- |\n| Player bodies | {bodies} | Grounded-2026 procedural construction |\n| Player hair | {hairs} | Grounded-2026 procedural construction |\n| Equipment overlays | {equipment} | Grounded-2026 articulated overlays |\n| NPC role sheets | {roles} | Grounded-2026 humanoid role construction |\n| Mob sheets | {mobs} | Grounded-2026 beast/spirit constructions |\n| **Total** | **{sheets}** | **{frames} nonblank state/direction/frame cells validated** |\n\nThe permanent `tools/validate_grounded_actor_assets.py` contract verifies exact active coverage, RGBA/grid dimensions, nonblank cells, motion-distinct action/death states, manifest hashes, rejected historical hashes, and zero actor fallback. The source wrappers are `tools/art/people.py` and `tools/art/fauna.py`; articulated construction lives under `atelier/forge/grounded_*.py`. Clean regeneration therefore cannot silently restore the replaced actor families.\n\n## Non-actor sprite direction\n\nNon-actor art was retained where it already fits the coherent pixel presentation rather than churned cosmetically. Atelier integration remains active only for compatible non-actor groups: `{json.dumps(nonactor,sort_keys=True)}`. Terrain, props, buildings, resources, chests, structures, item icons and ability presentation remain covered by the permanent visual/game-asset validators and native review matrices. Newly introduced opening-reward icons are generated project art when no historical Atelier source exists and are explicitly counted by the full runtime coverage audit.\n\n## UI migration\n\nThe existing Task 12 modal/focus/input architecture is preserved. `PageLayoutProfiles` now controls real window geometry and purpose summaries. Permanent Windows tests cover all existing pages at 1024×720, 1280×720, 1920×1080 and 2560×1440 across supported text scales, with additional content-scale emulation and keyboard/mouse/focus/error-state assertions.\n\n## Human-only gates\n\nAutomated coverage does **not** assert artistic taste, animation feel, human onboarding duration/retention, physical Windows monitor DPI, or subjective usability/readability. Those remain explicit human acceptance gates; repository-side implementation and integrity checks do not convert them into approvals.\n'''
          Path('docs/ASSET_MIGRATION_FIRST_HOUR_UI.md').write_text(doc,encoding='utf-8')
          PY
          git rm -f \
            .github/workflows/first-hour-baseline.yml \
            .github/workflows/grounded-motion-repair.yml \
            .github/workflows/grounded-spirit-repair.yml \
            .github/workflows/opening-integration-repair.yml \
            .github/workflows/opening-integration.yml \
            .github/workflows/opening-native-diagnostic.yml \
            .github/workflows/opening-native-log-diagnostic.yml
          git diff --check
      - name: Commit finalized UI and cleanup to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          test -n "$(git status --porcelain)"
          git commit -m 'feat(ui): finalize first-hour presentation and cleanup'
          git push origin HEAD:main
