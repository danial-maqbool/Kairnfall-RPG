name: Inspect reconstructed opening objective
on:
  push:
    branches: [main]
    paths: ['.github/workflows/grounded-motion-repair.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct immutable candidate and print objective source
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_BLOB: d1e06c7aa3bbbb3d0332ca7d7aeaa34f90395714
          OPENING_BASE: a356e3c881ab9b3cacc8f2e1ca696322a8a2ed8d
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$OPENING_BASE"
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          sha=os.environ['PREPARE_BLOB']
          req=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response: obj=json.load(response)
          raw=base64.b64decode(''.join(obj['content'].splitlines()))
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
          tmp=pathlib.Path(os.environ['RUNNER_TEMP']); script=tmp/'prepare.py'; script.write_bytes(raw)
          env=os.environ.copy(); env.update(GITHUB_SHA=os.environ['OPENING_BASE'],RUNNER_TEMP=str(tmp/'evidence'))
          pathlib.Path(env['RUNNER_TEMP']).mkdir(parents=True,exist_ok=True)
          subprocess.run(['python3',str(script)],env=env,check=True)
          for rel in ('client/Scripts/GameRoot.Opening.cs','src/Kairnfall.Core/OpeningJourney.cs'):
              print('===== '+rel+' =====')
              lines=pathlib.Path(rel).read_text(encoding='utf-8').splitlines()
              for i,line in enumerate(lines):
                  if any(term in line.lower() for term in ('tooltip','objective','reward','medicine','recommend','initial')):
                      print('\n'.join(lines[max(0,i-4):min(len(lines),i+7)])); print('---')
          PY
