name: Inspect final opening native blocker
on:
  push:
    branches: [main]
    paths: ['.github/workflows/grounded-motion-repair.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print native failure context
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10426215919'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o artifact.zip
          unzip -q artifact.zip -d evidence
          for log in experience controls import; do
            echo "===== ${log}.log failure context ====="
            grep -nE -C 20 'ERROR:|SCRIPT ERROR:|Unhandled exception|FAIL|Exception|Error|CONTRACT' "evidence/logs/${log}.log" | tail -n 500 || true
            echo "===== ${log}.log tail ====="
            tail -n 180 "evidence/logs/${log}.log" || true
          done
