name: Inspect opening objective tooltip
on:
  push:
    branches: [main]
    paths: ['.github/workflows/grounded-motion-repair.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decode immutable opening sources and print objective construction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,urllib.request
          for sha,name in [('27997cfb03a84a089f2dae2970ed3821a3d2c567','GameRoot.Opening.cs'),('75a5a1c6781183638a7836671a17a1b07c4f3b65','OpeningJourney.cs')]:
              req=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: obj=json.load(response)
              text=base64.b64decode(''.join(obj['content'].splitlines())).decode('utf-8')
              print(f'===== {name} =====')
              lines=text.splitlines()
              for i,line in enumerate(lines):
                  if any(term.lower() in line.lower() for term in ('tooltip','objective','reward','medicine','initial','recommend')):
                      for row in lines[max(0,i-5):min(len(lines),i+8)]: print(row)
                      print('---')
          PY
