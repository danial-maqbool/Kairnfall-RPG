name: Publish deterministic sprite refinement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase5-deterministic-sprite-refinement.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: phase5-deterministic-sprite-refinement
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare pinned build inputs and safety snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow==12.0.0
          python tools/build_content.py
          mkdir -p artifacts/phase5/{preview,engine,logs}
          python - <<'PY'
          import json
          from pathlib import Path
          roots=[Path('atelier/Assets'),Path('foundry/Assets/atlas_atelier')]
          snapshot={root.as_posix():sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()) for root in roots}
          Path('artifacts/phase5/before-paths.json').write_text(json.dumps(snapshot,sort_keys=True,indent=2)+'\n')
          print('SOURCE-CONTROLLED GENERATED PATHS:',sum(len(v) for v in snapshot.values()))
          PY
      - name: Apply reviewed art-only refinement and remove timing from generated metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path

          expected_blobs={
            'atelier/forge/brush.py':'b9eee2f067d1c83c18c741d3f2e7e63f3a654469',
            'atelier/forge/folk.py':'04e0178a054ce49a7293e9db1045b60a6ec6949c',
            'atelier/forge/beasts.py':'9000cbc33c68f67cc681349f503342e5d55be8c6',
            'atelier/forge/smith.py':'684e146c9919ec69605a8ed54b56c1de2ad06e66',
          }
          for path,expected in expected_blobs.items():
            actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
            if actual!=expected:
              raise SystemExit(f'Refuse unreviewed source base for {path}: {actual} != {expected}')

          chunks=[
            '0ba9e986cd5942be38c72bd7b4c85bf96266ae1c',
            '6f87b28ed7e6c0b035a7314aeecda270095a0591',
            'ceb3771df7753becb9ef7848295eb9b9633e641e',
            '53e288c17aca2273de79d97942e57f46314f1b5a',
            '100d019092a07dece4c8329e46f9afd87510a783',
            '86cd76b0e1bfd1725f41b275f82c29833e728e77',
            'b19419d0285c4a69f2377a712a611b77d8de2b2d',
            '478a5b5d1ddcfae7e31e3b9ca8d543eb4cdee085',
            '4764450d7b82a9b8ec63264d4a06f9a17dc8af7f',
            'bb1472b73daf1cd1d0301e10b5c2c8745fbb6c68',
            'b3313837634452a0a3468e89a218099968910960',
            '445bdd1f6fb54ed3c6a74d545dd26b463881335e',
            'e742a100a11cce4bb5582ee5935f199288674956',
            '9db5ba4e8e5321345660e32a5b35dd53626fd981',
            'fa48b836427797787f6c1a01924b5dfe03419e3c',
            '90b42657351fa5ef52c575577676ba82ed4eb6a4',
            'e5ae595d7a969c863ee1c993f86dc0c109d7e3fe',
            '188a1479619bcb1bfb459cb0e2ad5cf7d3f2491c',
          ]
          expected_patch='e28b3c6a1fd53318f94fd5ff4af610c1d742b6254109019d87cdce130cddad16'
          encoded=[]
          for sha in chunks:
            url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}"
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=45) as response:
              record=json.load(response)
            raw=base64.b64decode(record['content'])
            actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            if actual!=sha:
              raise SystemExit('Patch chunk integrity failed: '+sha)
            encoded.append(raw.decode('ascii'))
          encoded_text=''.join(encoded)
          if len(encoded_text)!=33012:
            raise SystemExit(f'Encoded patch length mismatch: {len(encoded_text)}')
          patch=base64.b64decode(encoded_text,validate=True)
          if hashlib.sha256(patch).hexdigest()!=expected_patch:
            raise SystemExit('Reviewed patch SHA-256 mismatch')
          patch_path=Path('artifacts/phase5/refinement.patch')
          patch_path.write_bytes(patch)

          includes=[
            'atelier/forge/brush.py','atelier/forge/folk.py','atelier/forge/beasts.py',
            'atelier/forge/smith.py','atelier/tests/test_sprite_refinement.py',
          ]
          apply=['git','apply']+[f'--include={path}' for path in includes]+[str(patch_path)]
          subprocess.run(apply[:2]+['--check']+apply[2:],check=True)
          subprocess.run(apply,check=True)

          build=Path('atelier/build.py')
          text=build.read_text(encoding='utf-8')
          timing="        'built_seconds': round(time.time() - start, 1),\n"
          if text.count(timing)!=1 or text.count("report['built_seconds']")!=1:
            raise SystemExit('atelier/build.py timing metadata shape changed')
          text=text.replace(timing,'').replace("report['built_seconds']","time.time() - start")
          build.write_text(text,encoding='utf-8')

          subprocess.run(['git','add','--']+includes+['atelier/build.py'],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected=set(includes)|{'atelier/build.py'}
          if changed!=expected:
            raise SystemExit('Unexpected source patch paths: '+repr(sorted(changed)))
          print('REVIEWED ART PATCH:',expected_patch,'; SOURCE PATHS:',len(changed))
      - name: Run focused deterministic sprite contracts and review sheets
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest atelier.tests.test_sprite_refinement -v 2>&1 | tee artifacts/phase5/logs/refinement-tests.log
          for sheet in body beasts items gear scene; do
            python atelier/preview.py "$sheet" --out "artifacts/phase5/preview/$sheet.png"
          done
      - name: Rebuild affected source-controlled libraries twice and prove exact determinism
        shell: bash
        run: |
          set -euo pipefail
          rebuild() {
            python atelier/build.py --only items people equipment npcs mobs gear gear_worn --jobs 8
            python atelier/build.py --manifest
            python foundry/build.py --pack-atelier --atlas
          }
          rebuild 2>&1 | tee artifacts/phase5/logs/art-build-first.log
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          before=json.loads(Path('artifacts/phase5/before-paths.json').read_text())
          for root_text,expected in before.items():
              root=Path(root_text); actual=sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())
              if actual!=expected:
                  added=sorted(set(actual)-set(expected)); removed=sorted(set(expected)-set(actual))
                  raise SystemExit(f'Generated path set changed under {root}: added={added[:20]} removed={removed[:20]}')
          manifest=json.loads(Path('atelier/Assets/manifest.json').read_text())
          keys=[entry['key'] for entry in manifest['assets']]
          if len(keys)!=len(set(keys)):
              raise SystemExit('Duplicate Atelier asset keys after regeneration')
          values={}
          for root in [Path('atelier/Assets'),Path('foundry/Assets/atlas_atelier')]:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  values[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          for p in [Path('atelier/gear.json'),Path('atelier/coverage.json')]:
              values[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('artifacts/phase5/first-hashes.json').write_text(json.dumps(values,sort_keys=True,indent=2)+'\n')
          print('FIRST DETERMINISTIC SNAPSHOT:',len(values),'files')
          PY
          rebuild 2>&1 | tee artifacts/phase5/logs/art-build-second.log
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected=json.loads(Path('artifacts/phase5/first-hashes.json').read_text()); actual={}
          for root in [Path('atelier/Assets'),Path('foundry/Assets/atlas_atelier')]:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  actual[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          for p in [Path('atelier/gear.json'),Path('atelier/coverage.json')]:
              actual[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if expected!=actual:
              bad=sorted(k for k in set(expected)|set(actual) if expected.get(k)!=actual.get(k))
              raise SystemExit('Non-deterministic generated output: '+', '.join(bad[:40]))
          print('DETERMINISM PASS:',len(actual),'files; no metadata exclusions')
          PY
      - name: Validate final game pack
        shell: bash
        run: |
          set -euo pipefail
          dotnet build client/Kairnfall.Client.csproj -c Debug 2>&1 | tee artifacts/phase5/logs/client-build.log
          python tools/build_game_assets.py 2>&1 | tee artifacts/phase5/logs/game-assets.log
          python tools/complete_skill_icons.py 2>&1 | tee artifacts/phase5/logs/skill-icons.log
          python tools/validate_game_assets.py 2>&1 | tee artifacts/phase5/logs/game-assets-validation.log
      - name: Install verified Godot editor
        shell: bash
        run: |
          set -euo pipefail
          python tools/get_godot.py --os linux 2>&1 | tee artifacts/phase5/logs/godot.log
      - name: Run native renderer contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 "$GODOT_BIN" --headless --editor --path client --import 2>&1 | tee artifacts/phase5/logs/import.log
          timeout 180 "$GODOT_BIN" --headless --path client res://Tests/CompactItemCardContract.tscn 2>&1 | tee artifacts/phase5/logs/native-item-card.log
          for log in import native-item-card; do
            if grep -E '(^|[[:space:]])(ERROR:|SCRIPT ERROR:|Unhandled exception)' "artifacts/phase5/logs/$log.log"; then exit 1; fi
          done
      - name: Stage only reproducible sources and stable generated paths
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet HEAD -- client/Assets tools/art content_src content
          git add -- atelier/build.py atelier/forge/brush.py atelier/forge/folk.py atelier/forge/beasts.py atelier/forge/smith.py \
            atelier/tests/test_sprite_refinement.py atelier/Assets atelier/coverage.json atelier/gear.json foundry/Assets/atlas_atelier
          git diff --cached --check
          git diff --cached --name-only | tee artifacts/phase5/published-files.txt
          python - <<'PY'
          from pathlib import Path
          paths=Path('artifacts/phase5/published-files.txt').read_text().splitlines()
          allowed=('atelier/build.py','atelier/forge/brush.py','atelier/forge/folk.py','atelier/forge/beasts.py','atelier/forge/smith.py',
                   'atelier/tests/test_sprite_refinement.py','atelier/Assets/','atelier/coverage.json','atelier/gear.json','foundry/Assets/atlas_atelier/')
          bad=[p for p in paths if not any(p==x or p.startswith(x) for x in allowed)]
          if not paths or bad:
              raise SystemExit('Unexpected publish scope: '+repr(bad))
          print('PUBLISH SCOPE:',len(paths),'existing/stable-path files')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-deterministic-sprite-refinement-${{ github.sha }}
          path: artifacts/phase5/
          if-no-files-found: error
          retention-days: 14
      - name: Commit and push only after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Danial Maqbool'
          git config user.email 'danial.maqbool48@gmail.com'
          git commit -m 'refactor(art): add deterministic pixel-detail refinement' \
            -m 'Preserve sprite canvases, alpha masks, rig anchors and stable asset paths while adding upper-left highlights, lower-right shadow clusters, garment construction cues, species surface detail and deterministic item material polish. Stable species seeds and item identifiers control procedural variation. Remove wall-clock duration from source-controlled coverage metadata and require byte-identical repeat builds.'
          git push origin HEAD:main
