name: Opening native diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opening-native-diagnostic.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Download failed opening artifact and print native logs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10422513398'
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o artifact.zip
          unzip -q artifact.zip -d evidence
          echo '--- import.log tail ---'
          tail -n 120 evidence/logs/import.log || true
          echo '--- experience.log ---'
          cat evidence/logs/experience.log || true
          echo '--- controls.log ---'
          cat evidence/logs/controls.log || true
          echo '--- native failure markers ---'
          grep -R -nE 'ERROR:|SCRIPT ERROR:|Unhandled exception|FAIL|Exception|Error' evidence/logs || true
