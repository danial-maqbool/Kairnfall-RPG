name: Task 6 Progression Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/task6-progression-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch first skill threshold
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/Kairnfall.Core/Mechanics.cs")
          text = path.read_text()
          old = """    public static long Threshold(int level)
              {
                  long n=Math.Clamp(level,1,SkillCap)-1; return 100*n*n+20*n*n*n;
              }"""
          new = """    public static long Threshold(int level)
              {
                  int clamped=Math.Clamp(level,1,SkillCap);
                  if(clamped==2) return 90;
                  long n=clamped-1; return 100*n*n+20*n*n*n;
              }"""
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one progression threshold method to patch.")
          path.write_text(text.replace(old, new), newline="\n")
      - name: Commit narrow Task 6 correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Kairnfall.Core/Mechanics.cs
          git diff --cached --check
          git commit -m "fix: preserve first-hour progression sequence"
          git push origin HEAD:main
