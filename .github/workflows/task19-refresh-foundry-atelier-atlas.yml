name: Temporary Task 19 Foundry Atelier atlas refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task19-refresh-foundry-atelier-atlas.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Regenerate and publish only the stale packed Atelier atlas
        shell: bash
        run: |
          set -euo pipefail
          python foundry/build.py --pack-atelier --atlas
          git restore --worktree -- foundry/coverage.json 2>/dev/null || true
          python - <<'PY'
          import subprocess
          allowed={
              'foundry/Assets/atlas_atelier/atelier.json',
              'foundry/Assets/atlas_atelier/atelier_0.png',
          }
          changed={p for p in subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0') if p}
          unexpected=sorted(changed-allowed)
          if unexpected:
              raise SystemExit('Unexpected generated drift: '+', '.join(unexpected))
          missing=sorted(allowed-changed)
          if missing:
              raise SystemExit('Expected stale atlas outputs did not change: '+', '.join(missing))
          print('Atlas refresh is exactly bounded to the two expected outputs.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add foundry/Assets/atlas_atelier/atelier.json foundry/Assets/atlas_atelier/atelier_0.png
          git commit -m 'Refresh Foundry Atelier atlas for Task 19'
          git push origin HEAD:main
