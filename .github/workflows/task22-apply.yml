name: Apply Task 22
on:
  push:
    branches: [main]
    paths:
      - tools/task22_apply.py
      - .github/workflows/task22-apply.yml
permissions:
  contents: write
jobs:
  apply-task22:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply Task 22 source changes
        run: python3 tools/task22_apply.py
      - name: Make rollback fixture use current state references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tools/world_probe/Task22EndgameChecks.cs')
          text=path.read_text(encoding='utf-8')
          old='''            var accept=Command(p,"endgame_accept",quest.Id);var far=realm.Execute(p.Id,accept);Need(!far.Ok,"Remote faction contract acceptance bypassed registrar proximity.");\n            p.Zone=registrar.Zone;p.Position=registrar.Position;accept=Command(p,"endgame_accept",quest.Id);var accepted=realm.Execute(p.Id,accept);Need(accepted.Ok,accepted.Message);Need(p.Quests.ContainsKey(quest.Id),"Accepted faction contract was not persisted in quest state.");\n            var early=realm.Execute(p.Id,Command(p,"endgame_claim",quest.Id));Need(!early.Ok,"Incomplete faction contract was claimable.");\n            var progress=p.Quests[quest.Id];'''
          new='''            var accept=Command(p,"endgame_accept",quest.Id);var far=realm.Execute(p.Id,accept);Need(!far.Ok,"Remote faction contract acceptance bypassed registrar proximity.");\n            p=realm.Player(p.Id);p.Zone=registrar.Zone;p.Position=registrar.Position;accept=Command(p,"endgame_accept",quest.Id);var accepted=realm.Execute(p.Id,accept);Need(accepted.Ok,accepted.Message);Need(p.Quests.ContainsKey(quest.Id),"Accepted faction contract was not persisted in quest state.");\n            var early=realm.Execute(p.Id,Command(p,"endgame_claim",quest.Id));Need(!early.Ok,"Incomplete faction contract was claimable.");\n            p=realm.Player(p.Id);var progress=p.Quests[quest.Id];'''
          if text.count(old)!=1: raise SystemExit('rollback fixture target missing')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
      - name: Regenerate deterministic catalog
        run: python3 tools/build_content.py
      - name: Compile solution
        run: dotnet build Kairnfall.slnx -c Release
      - name: Run core regression suite
        run: dotnet run --no-build --project tests/Kairnfall.Tests/Kairnfall.Tests.csproj -c Release -- content/catalog.json
      - name: Run world probe including Task 22 checks
        run: dotnet run --no-build --project tools/world_probe/world_probe.csproj -c Release
      - name: Commit production Task 22 and clean applicator
        shell: bash
        run: |
          rm .github/workflows/task22-apply.yml tools/task22_apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No Task 22 changes to commit.'; exit 1; }
          git commit -m "Task 22: add faction endgame loops"
          git push origin HEAD:main
