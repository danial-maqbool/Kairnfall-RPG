name: Temporary Task 7 persistence patch
on:
  push:
    paths:
      - '.github/workflows/task7-persistence-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire full restart validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/Kairnfall.Server/RealmHost.cs')
          text=path.read_text()
          old='''        engine.RecoverLegacyLootPositions();\n        engine.State.Trades.Clear();\n        ValidatePersistentState(engine);'''
          new='''        engine.RecoverLegacyLootPositions();\n        engine.State.Trades.Clear();\n        PersistenceIntegrity.RequireValid(engine);\n        ValidatePersistentState(engine);'''
          if old not in text:
              raise SystemExit('Expected RealmHost startup block not found')
          path.write_text(text.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Kairnfall.Server/RealmHost.cs
          git commit -m "fix: fail closed on corrupt persisted realm state"
          git push origin HEAD:main
