services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ../../.tools/windows/dev/.env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - kairnfall_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  kairnfall_pg_data:
