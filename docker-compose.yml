name: kairnfall-local
services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairnfall
      POSTGRES_DB: kairnfall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run Run-Kairnfall.ps1 to create the private local configuration}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - realm-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kairnfall -d kairnfall']
      interval: 3s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
volumes:
  realm-data:
